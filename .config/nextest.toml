[store]
dir = "target/nextest"

[profile.default]
fail-fast = true
failure-output = "immediate-final"
final-status-level = "fail"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
final-status-level = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }
