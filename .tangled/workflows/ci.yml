when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: "nixery"

clone:
  depth: 1
  submodules: false

dependencies:
  nixpkgs:
    - devenv
    - nix

environment:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"

steps:
  - name: "Complete devenv verification"
    command: |
      set -euo pipefail

      devenv test --no-tui

  - name: "Nix flake verification"
    command: |
      set -euo pipefail

      nix flake check --accept-flake-config
