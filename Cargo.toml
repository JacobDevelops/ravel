[workspace]
resolver = "3"
members = [
  "crates/*",
  "examples/content-mod",
  "examples/guide-snippets",
  "examples/minimal-mod",
  "examples/stateful-mod",
  "registry/mods/*",
  "test-mods/*",
  "tests/conformance",
  "tools/ravel-xtask",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
# The nightly toolchain enables Cargo lints; this is the minimum supported Rust version.
rust-version = "1.95"

[workspace.dependencies]
jni = "0.22.4"
noak = "=0.7.0"
num-traits = { version = "0.2.19", default-features = false }
proguard = { version = "=5.10.4", default-features = false }
proc-macro2 = "1.0.107"
quote = "1.0.47"
ravel-bootstrap-runtime = { path = "crates/ravel-bootstrap-runtime", version = "0.0.0" }
ravel-config = { path = "crates/ravel-config", version = "0.0.0" }
ravel-core = { path = "crates/ravel-core", version = "0.0.0" }
ravel-data = { path = "crates/ravel-data", version = "0.0.0" }
ravel-example-content-mod = { path = "examples/content-mod", version = "0.0.0" }
ravel-example-minimal-mod = { path = "examples/minimal-mod", version = "0.0.0" }
ravel-example-stateful-mod = { path = "examples/stateful-mod", version = "0.0.0" }
ravel-host-api = { path = "crates/ravel-host-api", version = "0.0.0" }
ravel-host-runtime = { path = "crates/ravel-host-runtime", version = "0.0.0" }
ravel-loader = { path = "crates/ravel-loader", version = "0.0.0" }
ravel-minecraft = { path = "crates/ravel-minecraft", version = "0.0.0" }
ravel-minecraft-adapter = { path = "crates/ravel-minecraft-adapter", version = "0.0.0" }
ravel-minecraft-generate = { path = "crates/ravel-minecraft-generate", version = "0.0.0" }
ravel-network = { path = "crates/ravel-network", version = "0.0.0" }
ravel-observability = { path = "crates/ravel-observability", version = "0.0.0" }
ravel-pack = { path = "crates/ravel-pack", version = "0.0.0" }
ravel-package = { path = "crates/ravel-package", version = "0.0.0" }
ravel-renderer = { path = "crates/ravel-renderer", version = "0.0.0" }
ravel-resolve = { path = "crates/ravel-resolve", version = "0.0.0" }
ravel-save = { path = "crates/ravel-save", version = "0.0.0" }
ravel-sdk = { path = "crates/ravel-sdk", version = "0.0.0" }
ravel-sdk-macros = { path = "crates/ravel-sdk-macros", version = "0.0.0" }
ravel-test-mod-audio = { path = "test-mods/audio", version = "0.0.0" }
ravel-test-mod-client-only = { path = "test-mods/client-only", version = "0.0.0" }
ravel-test-mod-commands = { path = "test-mods/commands", version = "0.0.0" }
ravel-test-mod-configuration = { path = "test-mods/configuration", version = "0.0.0" }
ravel-test-mod-events = { path = "test-mods/events", version = "0.0.0" }
ravel-test-mod-inter-mod-service = { path = "test-mods/inter-mod-service", version = "0.0.0" }
ravel-test-mod-interception = { path = "test-mods/interception", version = "0.0.0" }
ravel-test-mod-networking = { path = "test-mods/networking", version = "0.0.0" }
ravel-test-mod-noop = { path = "test-mods/noop", version = "0.0.0" }
ravel-test-mod-optional-service = { path = "test-mods/optional-service", version = "0.0.0" }
ravel-test-mod-provision = { path = "test-mods/provision", version = "0.0.0" }
ravel-test-mod-render-stages = { path = "test-mods/render-stages", version = "0.0.0" }
ravel-test-mod-resources = { path = "test-mods/resources", version = "0.0.0" }
ravel-test-mod-registries = { path = "test-mods/registries", version = "0.0.0" }
ravel-test-mod-saved-data = { path = "test-mods/saved-data", version = "0.0.0" }
ravel-test-mod-server-data = { path = "test-mods/server-data", version = "0.0.0" }
ravel-test-mod-server-only = { path = "test-mods/server-only", version = "0.0.0" }
ravel-test-mod-world-shaping = { path = "test-mods/world-shaping", version = "0.0.0" }
ravel-build = { path = "crates/ravel-build", version = "0.0.0" }
ravel-composed-host = { path = "crates/ravel-composed-host", version = "0.0.0" }
ravel-testkit = { path = "crates/ravel-testkit", version = "0.0.0" }
rvl-042-counterpart = { path = "registry/mods/rvl-042-counterpart", version = "0.1.0" }
rvl-120-counterpart = { path = "registry/mods/rvl-120-counterpart", version = "0.1.0" }
rvl-210-counterpart = { path = "registry/mods/rvl-210-counterpart", version = "0.1.0" }
rvl-321-counterpart = { path = "registry/mods/rvl-321-counterpart", version = "0.1.0" }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
syn = { version = "2.0.119", features = ["full"] }
toml = "1.1.4"
zip = { version = "=9.0.3", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

[workspace.lints.cargo]
default = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "forbid"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
# conflicts with rustc's unreachable_pub, which wants pub(crate)
redundant_pub_crate = "allow"
wildcard_dependencies = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
as_conversions = "deny"
wildcard_enum_match_arm = "deny"
infinite_loop = "deny"
integer_division = "deny"
let_underscore_must_use = "deny"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
