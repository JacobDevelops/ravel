[workspace]
resolver = "3"
members = [
  "crates/*",
  "experiments/adg-1-jvm-entry",
  "experiments/adg-2-guest",
  "experiments/adg-2-mod-execution",
  "experiments/adg-3-bindings",
  "experiments/adg-4-state",
  "experiments/adg-5-prism",
  "experiments/spike-harness",
  "test-mods/*",
  "tests/conformance",
  "tools/*",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.95"

[workspace.dependencies]
jni = "0.22.4"
miniz_oxide = "0.8.9"
ravel-bootstrap = { path = "crates/ravel-bootstrap", version = "0.0.0" }
ravel-config = { path = "crates/ravel-config", version = "0.0.0" }
ravel-core = { path = "crates/ravel-core", version = "0.0.0" }
ravel-data = { path = "crates/ravel-data", version = "0.0.0" }
ravel-host-api = { path = "crates/ravel-host-api", version = "0.0.0" }
ravel-loader = { path = "crates/ravel-loader", version = "0.0.0" }
ravel-minecraft = { path = "crates/ravel-minecraft", version = "0.0.0" }
ravel-minecraft-adapter = { path = "crates/ravel-minecraft-adapter", version = "0.0.0" }
ravel-network = { path = "crates/ravel-network", version = "0.0.0" }
ravel-observability = { path = "crates/ravel-observability", version = "0.0.0" }
ravel-pack = { path = "crates/ravel-pack", version = "0.0.0" }
ravel-package = { path = "crates/ravel-package", version = "0.0.0" }
ravel-resolve = { path = "crates/ravel-resolve", version = "0.0.0" }
ravel-save = { path = "crates/ravel-save", version = "0.0.0" }
ravel-sdk = { path = "crates/ravel-sdk", version = "0.0.0" }
ravel-sdk-macros = { path = "crates/ravel-sdk-macros", version = "0.0.0" }
ravel-spike-adg-2-guest = { path = "experiments/adg-2-guest", version = "0.0.0" }
ravel-spike-adg-3-bindings = { path = "experiments/adg-3-bindings", version = "0.0.0" }
ravel-spike-harness = { path = "experiments/spike-harness", version = "0.0.0" }
ravel-test-mod-noop = { path = "test-mods/noop", version = "0.0.0" }
ravel-testkit = { path = "crates/ravel-testkit", version = "0.0.0" }
rustix = { version = "1.1.4", default-features = false, features = ["process"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
