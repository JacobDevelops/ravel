# Compile every version's screens and stubs, including obfuscated unnamed-package types.
# Packaging only the last selected version left other versions' Java uncompiled.
# Stub compilation needs no game jars, but translating sources need their published mapping.
# Persist skipped-version verdicts so the gate can reconcile actual coverage.
[tasks."ravel:verify-java"]
description = "Compile every tracked version's generated Java."
dependencies = ["ravel:prepare-normalizer"]
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "bash"
script = '''
set -euo pipefail
cd "${CARGO_MAKE_WORKING_DIRECTORY}"

compiled="${CARGO_MAKE_WORKING_DIRECTORY}/target/ravel-jvm/compiled-versions.txt"
mkdir -p "$(dirname "$compiled")"
: >"$compiled"

# Two probe jars, one signed and one not, both holding a class in the
# unnamed package. They are what gives a build machine the condition the
# launch had and nothing here otherwise has: Mojang ships a signed client
# jar, and an obfuscated version puts its classes where the generated
# screens go. Built once, because neither depends on a Minecraft version.
probe="${CARGO_MAKE_WORKING_DIRECTORY}/target/ravel-jvm/signer-probe"
rm -rf "$probe"
mkdir -p "$probe/signed" "$probe/unsigned"
echo 'public final class RavelSignerProbeSigned {}' \
  >"$probe/RavelSignerProbeSigned.java"
echo 'public final class RavelSignerProbeUnsigned {}' \
  >"$probe/RavelSignerProbeUnsigned.java"
javac -d "$probe/signed" "$probe/RavelSignerProbeSigned.java"
javac -d "$probe/unsigned" "$probe/RavelSignerProbeUnsigned.java"
jar --create --file "$probe/signed.jar" -C "$probe/signed" RavelSignerProbeSigned.class
jar --create --file "$probe/unsigned.jar" \
  -C "$probe/unsigned" RavelSignerProbeUnsigned.class
keytool -genkeypair -alias ravel-probe -keyalg RSA -keysize 2048 \
  -dname CN=ravel-signer-probe -validity 1 \
  -keystore "$probe/keystore.p12" -storetype PKCS12 \
  -storepass ravelprobe -keypass ravelprobe >/dev/null
jarsigner -keystore "$probe/keystore.p12" -storepass ravelprobe \
  "$probe/signed.jar" ravel-probe >/dev/null

for version_directory in minecraft/versions/*/; do
  version="$(basename "$version_directory")"
  export RAVEL_MINECRAFT_VERSION="$version"
  eligibility="$(cargo run --quiet --locked -p ravel-xtask -- version-matrix "$version")"
  if [[ "$eligibility" == unavailable:* ]]; then
    verdict="SKIPPED: Minecraft $version Java was NOT compiled; $eligibility"
    echo "$verdict" >&2
    echo "$verdict" >>"$compiled"
    continue
  fi

  # Generation is explicit: Cargo may restore build-script results from cache.
  RAVEL_MINECRAFT_VERSION="$version" \
    cargo run --locked -p ravel-xtask -- generate java
  if [ "$eligibility" = "generation-only" ]; then
    # The agent owns every source in generated/, including Hook and its
    # bootstrap-runtime dependencies. build-screen compiles that source set
    # through build-agent.sh, then compiles only generated screen sources
    # against the game stubs; placing generated/ on the stub path would make
    # Hook's real dependencies look like missing game stubs.
    ./jvm/build/build-screen.sh >/dev/null
    echo "compiled: Minecraft $version; generation-only, no harness run" | tee -a "$compiled"
    continue
  fi
  ./jvm/build/build-agent.sh >/dev/null
  ./jvm/build/build-screen.sh >/dev/null
  if grep -q 'LEGACY_ADAPTER = true' target/ravel-jvm/generated/dev/ravel/jvm/Hook.java; then
    # Legacy screen names resolve against their version-local stubs; modern signer
    # and screen-loader obligations run in the legacy-specific harness instead.
    echo "compiled: Minecraft $version" | tee -a "$compiled"
    continue
  fi

  # Every name the agent jar would open, opened, through the loader the
  # agent jar itself builds. Under an obfuscated version these have no
  # package, which is a shape nothing had ever asked a JVM to resolve.
  # The stubs join the class path because defining a screen resolves its
  # game superclass, and here that is the stub rather than the game; the
  # agent jar joins it because the check calls Screens.loader rather than
  # writing a loader that looks like it.
  names="$(sed -n 's/.*static final String [A-Z_]* = "\(.*\)";/\1/p' \
    target/ravel-jvm/generated/dev/ravel/jvm/ScreenNames.java)"
  if [ -z "$names" ]; then
    echo "ScreenNames records no screen for $version" >&2
    exit 1
  fi
  # The screen jar is passed as an argument rather than put on the class
  # path, because the check is about which loader defines those classes
  # and a class path would hand them to the parent.
  # Compiled rather than source-launched: this check calls into the agent
  # jar's own package, and a source launch defines the class in a loader
  # of the compiler's own, where that access is refused.
  names_classes="${CARGO_MAKE_WORKING_DIRECTORY}/target/ravel-jvm/screen-names-classes"
  rm -rf "$names_classes"
  mkdir -p "$names_classes"
  javac -Xlint:all -Werror -cp "target/ravel-jvm/ravel-agent.jar" \
    -d "$names_classes" jvm/harness/screen-names/dev/ravel/jvm/LoadScreens.java
  # shellcheck disable=SC2086
  java -cp "target/ravel-jvm/ravel-agent.jar:target/ravel-jvm/screen-stubs:$names_classes" \
    dev.ravel.jvm.LoadScreens \
    "target/ravel-jvm/ravel-screen.jar" \
    "$probe/signed.jar" "$probe/unsigned.jar" $names

  echo "compiled: Minecraft $version" | tee -a "$compiled"
done

if ! grep -q '^compiled: ' "$compiled"; then
  echo "no tracked version's Java was compiled, so this task proved nothing" >&2
  exit 1
fi
'''

[tasks."ravel:verify-gate-versions"]
description = "Hold every per-version gate task to having covered every tracked version."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "bash"
script = '''
set -euo pipefail
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
cargo run --locked -p ravel-xtask -- verify gate-versions
'''

# This is the gate that actually starts a JVM and exercises premain, not only its Rust callees.
# M3-W7 found null System.getProperty aborting every launch while unexecuted harness checks stayed green.
# Build the artifacts here so a clean checkout exercises the real launch path.
[tasks."ravel:verify-jvm"]
description = "Run Ravel's agent, transformer and native library against a real JVM."
dependencies = ["ravel:prepare-normalizer"]
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "bash"
script = '''
set -euo pipefail
cd "${CARGO_MAKE_WORKING_DIRECTORY}"

normalizer_jar="tests/fixtures/local/tooling/mapping-io-0.9.1.jar"
mkdir -p target/mapping-io-tests
"${JAVA_HOME:?JAVA_HOME must select the configured JDK}/bin/javac" \
  -Xlint:all -Werror -cp "$normalizer_jar" -d target/mapping-io-tests \
  crates/ravel-minecraft-generate/java/NormalizeMappings.java \
  crates/ravel-minecraft-generate/java/NormalizeMappingsTest.java
"$JAVA_HOME/bin/java" -cp "$normalizer_jar:target/mapping-io-tests" NormalizeMappingsTest

bash jvm/legacy-platform/launch.sh build

# One line per tracked version, and each is written after the harness
# returned rather than before it ran. `ravel-test` and `ravel-verify-java`
# write the same shape beside it, and one xtask verb holds all three to
# having covered every tracked version — which is what stops a loop that
# quietly stopped looping from passing.
ran="${CARGO_MAKE_WORKING_DIRECTORY}/target/ravel-jvm/harness-versions.txt"
mkdir -p "$(dirname "$ran")"
: >"$ran"

for version_directory in minecraft/versions/*/; do
  version="$(basename "$version_directory")"
  export RAVEL_MINECRAFT_VERSION="$version"
  eligibility="$(cargo run --quiet --locked -p ravel-xtask -- version-matrix "$version")"
  if [ "$eligibility" = "generation-only" ]; then
    echo "NOT-YET-RUN: Minecraft $version harness obligations not yet met" | tee -a "$ran"
    continue
  fi
  if [ "$eligibility" != "live" ]; then
    verdict="SKIPPED: Minecraft $version was NOT run by the harness; $eligibility"
    echo "$verdict" >&2
    echo "$verdict" >>"$ran"
    continue
  fi

  # Generate one version before packaging its shared output trees.
  RAVEL_MINECRAFT_VERSION="$version" \
    cargo run --locked -p ravel-xtask -- generate java
  RAVEL_MINECRAFT_VERSION="$version" \
    cargo build --locked -p ravel-composed-host --release
  ./jvm/build/build-agent.sh
  if grep -q 'LEGACY_ADAPTER = true' target/ravel-jvm/generated/dev/ravel/jvm/Hook.java; then
    ./jvm/build/build-screen.sh
    RAVEL_MINECRAFT_VERSION="$version" bash jvm/harness/run-legacy-harness.sh
    cp target/ravel-jvm/legacy-harness-sections.txt target/ravel-jvm/harness-sections.txt
  else
    RAVEL_MINECRAFT_VERSION="$version" ./jvm/harness/run-harness.sh
  fi

  # The harness names the sections it reached, and it names them as it
  # reaches them, so a run that died halfway records what it proved rather
  # than what it set out to prove.
  echo "ran: Minecraft $version sections=$(cat target/ravel-jvm/harness-sections.txt)" \
    | tee -a "$ran"
done

if ! grep -q '^ran: ' "$ran"; then
  echo "the harness ran for no tracked version, so this task proved nothing" >&2
  exit 1
fi
'''

