[tasks."ravel:verify-stack"]
description = "Verify the jj change stack contract."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "bash"
script = '''
set -euo pipefail
cd "${CARGO_MAKE_WORKING_DIRECTORY}"

if [[ ! -d .jj ]]; then
  echo "no jj repository here; skipping the stack contract"
  exit 0
fi

conventional='^(feat|fix|docs|refactor|perf|test|chore|build|ci|revert)(\([a-z0-9-]+\))?!?: .'
fixup='(?i)(\bwip\b|fixup|squash!|address (review|feedback)|review comments)'
status=0

report() {
  local found
  found=$(jj log --no-pager --no-graph -r "$1" \
    -T 'change_id.short() ++ " " ++ description.first_line() ++ "\n"')
  if [[ -n "$found" ]]; then
    printf '%s\n%s\n' "$2" "$found" >&2
    status=1
  fi
}

if [[ "$(jj config get git.write-change-id-header 2>/dev/null || true)" != "true" ]]; then
  echo "change ids are not written to git commits;" \
    "run: jj config set --repo git.write-change-id-header true" >&2
  status=1
fi

report "::@ & mutable() & ~(@ & empty()) & ~description(regex:'$conventional')" \
  "describe each change up front, planned empty ones included (jj describe -m ...):"
report "::@ & mutable() & description(regex:'$fixup')" \
  "revise the change that is wrong instead of stacking a follow-up (jj squash --into <change>):"
report "::@ & mutable() & conflicts()" \
  "resolve conflicts inside the change that carries them (jj resolve):"

exit "$status"
'''

[tasks."ravel:verify-milestone"]
description = "Verify one milestone evidence manifest."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "bash"
script = '''
set -euo pipefail
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
set -- ${@}
if [[ "$#" -ne 1 ]]; then
  echo "usage: cargo make ravel:verify-milestone m<N>" >&2
  exit 2
fi
cargo run --locked -p ravel-xtask -- verify milestone "${1^^}"
'''

[tasks."ravel:fixture-reconstruct"]
description = "Reconstruct the pinned fixture under the ignored local boundary."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
command = "cargo"
args = [
  "run",
  "--locked",
  "-p",
  "ravel-xtask",
  "--",
  "fixture",
  "reconstruct",
  "${@}",
]

[tasks."ravel:fixture-verify"]
description = "Verify pinned fixture versions, counts, and hashes."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
command = "cargo"
args = [
  "run",
  "--locked",
  "-p",
  "ravel-xtask",
  "--",
  "fixture",
  "verify",
  "${@}",
]

[tasks."ravel:verify"]
# Sequential dependencies preserve the shared generated-Java tree and verdict ordering.
dependencies = [
  "ravel:fmt",
  "ravel:typecheck",
  "ravel:lint",
  "ravel:test",
  "ravel:coverage",
  "ravel:audit",
  "ravel:verify-scaffold",
  "ravel:verify-example-pack",
  "ravel:verify-example-package",
  "ravel:verify-spikes",
  "ravel:verify-java",
  "ravel:verify-jvm",
  "ravel:verify-gate-versions",
  "ravel:registry-verify",
  "ravel:verify-stack",
]

[tasks."ravel:host-build"]
description = "Build an instance host from its installed packages."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
command = "cargo"
args = ["run", "--locked", "-p", "ravel-xtask", "--", "host", "build", "${@}"]

[tasks."ravel:registry-verify"]
description = "Verify the in-repository registry counterparts and contracts."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "bash"
script = '''
set -euo pipefail
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
status=0
python3 -B -m unittest discover -s registry/waves || status=1
RAVEL_FIXTURE_ID=atm10-tts-2.0.2 bash registry/checks/verify.sh --offline || status=1
bash registry/sevtech/verify.sh --offline || status=1
exit "$status"
'''

[tasks."ravel:registry-verify-fixture"]
description = "Verify registry contracts including local fixture evidence."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
command = "bash"
args = ["registry/sevtech/verify.sh", "--fixture"]
