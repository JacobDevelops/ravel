[config]
default_to_workspace = false
skip_core_tasks = true

[tasks."ravel:fmt"]
description = "Check Rust, shell, TOML, and Markdown formatting."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "bash"
script = '''
set -euo pipefail
cd "${CARGO_MAKE_WORKING_DIRECTORY}"

cargo fmt --all --check

# Every walk below prunes `tests/fixtures/local/`, and a prune rule that
# widens by a directory stops covering the public fixtures beside it
# without saying so. This is the gate on that: the public fixtures are
# repository content and have to reach the formatter.
require_public_fixtures() {
  local kind="$1"
  shift
  local missing
  missing="$(
    comm -23 \
      <(find ./tests/fixtures/public -type f -name "$kind" | sort) \
      <(printf '%s\n' "$@" | sort)
  )"
  if [ -n "$missing" ]; then
    echo "the $kind exclusion reaches past tests/fixtures/local and drops:" >&2
    echo "$missing" >&2
    exit 1
  fi
}

# Local fixtures are excluded from formatting; their tracked README stays in.
mapfile -d "" toml_files < <(
  find . -type f -name "*.toml" \
    -not -path "./.jj/*" \
    -not -path "./target/*" \
    -not -path "./tests/fixtures/local/*" \
    -print0
)
require_public_fixtures "*.toml" "${toml_files[@]}"
taplo format --check "${toml_files[@]}"

mapfile -d "" markdown_files < <(
  find . -type f -name "*.md" \
    -not -path "./.jj/*" \
    -not -path "./target/*" \
    -not \( -path "./tests/fixtures/local/*" \
      ! -path "./tests/fixtures/local/README.md" \) \
    -print0
)
require_public_fixtures "*.md" "${markdown_files[@]}"
markdownlint "${markdown_files[@]}"
'''

[tasks."ravel:typecheck"]
description = "Typecheck every workspace target and feature."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "bash"
script = '''
set -euo pipefail
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
cargo check --workspace --all-targets --all-features
'''

[tasks."ravel:lint"]
description = "Run Rust and GitHub Actions static analysis."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "bash"
script = '''
set -euo pipefail
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
cargo clippy --workspace --all-targets --all-features -- -D warnings
actionlint .github/workflows/*.yml
'''

[tasks."ravel:prepare-normalizer"]
description = "Acquire and verify the pinned mapping normalizer before version coverage is recorded."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "bash"
script = '''
set -euo pipefail
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
normalizer_jar="tests/fixtures/local/tooling/mapping-io-0.9.1.jar"
if [ ! -f "$normalizer_jar" ]; then
  mkdir -p "$(dirname "$normalizer_jar")"
  curl --fail --location --output "$normalizer_jar" \
    https://maven.fabricmc.net/net/fabricmc/mapping-io/0.9.1/mapping-io-0.9.1.jar
fi
printf '%s  %s\n' \
  aedc94b25a2fe7c09c898144ce33a1ef396680e984b07525d34916922d6ee3f4 \
  "$normalizer_jar" | sha256sum --check
'''

[tasks."ravel:test"]
description = "Run workspace and documentation tests."
dependencies = ["ravel:prepare-normalizer"]
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "bash"
script = '''
set -euo pipefail
cd "${CARGO_MAKE_WORKING_DIRECTORY}"

# The suite runs once per tracked version, not once against whichever one
# this shell selects. A green run against the selected version says
# nothing about the others, and that is not hypothetical: every crate
# that names a hook id, asserts on a linked class name, or ships a
# `compatibility.minecraft` was written against the selected one and
# twelve tests failed the first time another version was named.
#
# Matrix eligibility reads the typed adapter declaration and the real mapping
# input (Tiny or ProGuard). Generation-only versions do not run modern adapter
# tests or harnesses; the reconciliation gate reports those unmet obligations.
# Persist per-version verdicts so the gate can reconcile coverage.
tested="${CARGO_MAKE_WORKING_DIRECTORY}/target/ravel-jvm/tested-versions.txt"
mkdir -p "$(dirname "$tested")"
: >"$tested"
selected_version="$RAVEL_MINECRAFT_VERSION"
for version_directory in minecraft/versions/*/; do
  version="$(basename "$version_directory")"
  export RAVEL_MINECRAFT_VERSION="$version"
  eligibility="$(cargo run --quiet --locked -p ravel-xtask -- version-matrix "$version")"
  if [ "$eligibility" = "generation-only" ]; then
    cargo build --locked -p ravel-minecraft-adapter
    echo "built: Minecraft $version; adapter tests not yet run" | tee -a "$tested"
    continue
  fi
  if [ "$eligibility" != "live" ]; then
    verdict="SKIPPED: Minecraft $version adapter tests were NOT run; $eligibility"
    echo "$verdict" >&2
    echo "$verdict" >>"$tested"
    continue
  fi
  echo "testing Minecraft $version"
  RAVEL_MINECRAFT_VERSION="$version" \
    cargo nextest run --workspace --all-features
  RAVEL_MINECRAFT_VERSION="$version" \
    cargo nextest run --locked -p ravel-composed-host --no-default-features
  # Recorded after the suite passes, never before. A line written on the
  # way in says "started", and this file is read as "covered": a run
  # still on its first version, or one that died on it, would leave a
  # record that looks complete and names a version nothing proved.
  echo "tested: Minecraft $version" >>"$tested"
done
export RAVEL_MINECRAFT_VERSION="$selected_version"
if ! grep -q '^tested: ' "$tested"; then
  echo "no tracked version was testable, so this task proved nothing" >&2
  exit 1
fi

# nextest gives every test its own process, so state that leaks between
# tests through a process global is invisible to it by construction. The
# plain runner shares one process across threads, and ravel-bootstrap-runtime is
# the crate that holds such globals.
#
# This step failed once, on 2026-08-08, with no `test result:` line, no
# named test and no panic — the signature of the binary dying rather than
# a test asserting. It did not reproduce in roughly 53 further runs,
# isolated, under concurrent build load, or at --test-threads=1, so it is
# disclosed here rather than fixed speculatively: a fix for a cause
# nobody has established is a guess that later reads as a guarantee. If
# it recurs, capture the exit status first — 134 is SIGABRT, 139 SIGSEGV,
# 137 an OOM kill worth checking dmesg for.
cargo test -p ravel-bootstrap-runtime --all-features
cargo test --workspace --doc
check-jsonschema --check-metaschema schemas/*.schema.json
check-jsonschema --schemafile schemas/fixture.schema.json \
  tests/fixtures/descriptors/atm10-tts-2.0.2.json \
  tests/fixtures/descriptors/sevtech-ages-3.2.3.json
check-jsonschema --schemafile schemas/runtime-inputs.schema.json \
  tests/fixtures/descriptors/runtime-inputs-*.json
python3 -B -m unittest discover -s registry/sevtech -p 'test_*.py'
python3 -B -m unittest discover -s jvm/legacy-platform/tools -p 'test_*.py'
'''

[tasks."ravel:coverage"]
description = "Enforce the maintained Rust line-coverage floor."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "bash"
script = '''
set -euo pipefail
cd "${CARGO_MAKE_WORKING_DIRECTORY}"

# Shared cached objects retain the checkout paths used for instrumentation.
# This supported bypass is inherited by llvm-cov and nextest's Cargo processes;
# plain Cargo ignores it on machines without mbx.
export MBX_DISABLE=1
# cargo make may itself have inherited an active mbx session's rustc wrapper.
unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER
unset CARGO_BUILD_RUSTC_WRAPPER CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER

# Profiles from deleted sources otherwise survive and drag the figure down.
cargo llvm-cov clean --workspace
cargo llvm-cov nextest --workspace --all-features --ignore-filename-regex '/registry/' --fail-under-lines 80
'''

