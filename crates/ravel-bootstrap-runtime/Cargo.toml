[package]
name = "ravel-bootstrap-runtime"
description = "Safe hook runtime, JVM crossings, and game resource/data pack writer for Ravel hosts"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

# Shared safe runtime linked into generated hosts and the tracked JVM harness host.
[lib]
name = "ravel_bootstrap_runtime"
crate-type = ["rlib"]

[dependencies]
jni.workspace = true
ravel-config.workspace = true
ravel-core.workspace = true
ravel-data.workspace = true
ravel-host-api.workspace = true
ravel-loader.workspace = true
ravel-minecraft.workspace = true
ravel-minecraft-adapter.workspace = true
ravel-network.workspace = true
ravel-observability.workspace = true
ravel-renderer.workspace = true
ravel-save.workspace = true
serde_json.workspace = true

[dev-dependencies]
ravel-test-mod-audio.workspace = true
ravel-test-mod-commands.workspace = true
ravel-test-mod-networking.workspace = true
ravel-test-mod-saved-data.workspace = true

[lints]
workspace = true
