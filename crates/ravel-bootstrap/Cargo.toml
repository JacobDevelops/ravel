[package]
name = "ravel-bootstrap"
description = "Provisional official-JVM bootstrap selected by ADG-1"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

# `System.loadLibrary` resolves a shared object, so the crate has to produce one.
# The rlib is what this crate's own tests link against.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
ravel-config.workspace = true
ravel-core.workspace = true
ravel-host-api.workspace = true
ravel-loader.workspace = true
ravel-minecraft.workspace = true
ravel-minecraft-adapter.workspace = true
ravel-observability.workspace = true
serde_json.workspace = true

[lints]
workspace = true
