[package]
name = "ravel-minecraft-adapter"
description = "Shared version-adapter runtime and code generation boundary for Ravel"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"
# The generated hook surface is published to `ravel-bootstrap-runtime` through build
# script metadata, which Cargo forwards only for a package declaring `links`.
links = "ravel-minecraft-adapter"

[dependencies]
ravel-minecraft.workspace = true

[build-dependencies]
ravel-minecraft-generate.workspace = true

[lints]
workspace = true
