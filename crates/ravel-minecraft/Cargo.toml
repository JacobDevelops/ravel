[package]
name = "ravel-minecraft"
description = "Version-neutral Minecraft capability traits and handles"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# A handle is a borrowed JNI local reference and nothing else, so the lifetime
# that makes it safe is `jni`'s own. Modelling it here instead would be a second
# scheme with the same job and no borrow checker behind it.
jni.workspace = true
ravel-core.workspace = true
# A pack.mcmeta is a JSON document, and the only alternative to a serialiser is a
# hand-written escaper — which is what this replaced, after it turned out to
# escape three characters and emit invalid JSON for the rest of the C0 range.
serde_json.workspace = true

[lints]
workspace = true
