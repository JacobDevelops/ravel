[graph]
all-features = true
exclude-dev = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
# ISC covers libloading, which the JNI bindings use to open the runtime library.
# It is a permissive, OSI-approved licence with the same obligations as MIT.
allow = ["Apache-2.0", "ISC", "MIT", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
