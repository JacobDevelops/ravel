[graph]
all-features = true
exclude-dev = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]

[[licenses.exceptions]]
name = "proguard"
version = "5.10.4"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "foldhash"
version = "0.1.5"
allow = ["Zlib"]

[[licenses.exceptions]]
name = "zlib-rs"
version = "0.6.8"
allow = ["Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
