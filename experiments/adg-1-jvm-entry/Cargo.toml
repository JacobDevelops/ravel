[package]
name = "ravel-spike-adg-1-jvm-entry"
description = "ADG-1 JVM entry and hook candidates measured against the pinned game"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "ravel_spike_adg1"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ravel-spike-adg-1-hosted"
path = "src/bin/hosted.rs"

[dependencies]
jni = { version = "0.22.4", features = ["invocation"] }
ravel-spike-harness.workspace = true

# Measurement instruments may hold the unsafe a candidate needs in order to be
# measured at all. Every maintained crate keeps `#![forbid(unsafe_code)]`, and
# `ravel:verify-scaffold` fences this crate out of the production graph.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"

[lints.cargo]
default = "deny"
