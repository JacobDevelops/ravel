[package]
name = "ravel-spike-adg-2-guest"
description = "The one mod body every ADG-2 execution candidate runs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "ravel_spike_adg2_guest"
# Native dynamic library for the dylib candidate, WebAssembly module for the
# Wasm candidate, and a plain Rust library for the static and process
# candidates. One body, four bindings.
crate-type = ["cdylib", "rlib"]

# The exported symbols a dynamic or WebAssembly host resolves are unsafe
# attributes, so this measurement crate allows them. The mod body itself is safe.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"
