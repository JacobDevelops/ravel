[package]
name = "ravel-spike-adg-2-mod-execution"
description = "ADG-2 Rust execution and ABI candidates measured against one mod body"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "ravel-spike-adg-2-host"
path = "src/bin/host.rs"

[[bin]]
name = "ravel-spike-adg-2-worker"
path = "src/bin/worker.rs"

[dependencies]
libloading = "0.8.9"
ravel-spike-adg-2-guest.workspace = true
ravel-spike-harness.workspace = true
serde_json.workspace = true
wasmtime = { version = "47.0.2", default-features = false, features = [
  "cranelift",
  "runtime",
  "std",
] }

# Loading a dynamic library and calling a symbol out of it are unsafe operations
# that no crate can encapsulate, so this measurement crate allows them. The
# runner and the worker need none.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"
