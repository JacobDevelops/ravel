[package]
name = "ravel-spike-adg-3-bindings"
description = "ADG-3 binding extraction and generation measured against the pinned 26.1.2 jar"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "ravel_spike_adg3"
path = "src/lib.rs"

[[bin]]
name = "ravel-spike-adg-3-generate"
path = "src/bin/generate.rs"

[dependencies]
ravel-spike-harness.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# This experiment needs no unsafe: reading a class file is reading bytes.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[lints.cargo]
default = "deny"
