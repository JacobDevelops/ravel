[package]
name = "ravel-spike-adg-4-state"
description = "ADG-4 state ownership measured across one representative object flow"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "ravel_spike_adg4"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22.4"
ravel-spike-harness.workspace = true

# The exported JNI symbols the JVM resolves are unsafe attributes, so this
# measurement crate allows them. The runner needs none.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"
