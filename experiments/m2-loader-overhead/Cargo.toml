[package]
name = "ravel-spike-m2-loader-overhead"
description = "M2-W8 loader overhead measurement and the regression budget it sets"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
ravel-core.workspace = true
ravel-host-api.workspace = true
ravel-package.workspace = true
ravel-resolve.workspace = true
ravel-spike-harness.workspace = true
ravel-test-mod-noop.workspace = true
ravel-testkit.workspace = true
serde_json.workspace = true

# This experiment times safe Rust and shells out to cargo; nothing here needs
# unsafe, so it keeps the workspace's forbid rather than the measurement
# boundary's allowance.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[lints.cargo]
default = "deny"
