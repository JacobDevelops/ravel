# Feather named targets; locks resolve exact official descriptors and static flags.
# These are observations, not implemented runtime ports. WP4 owns the registration
# barrier, stable numeric IDs, 0..15 metadata, bounded payloads and saved-data policy.
schemaVersion = 1
minecraft = "1.12.2"

[[hook]]
id = "legacy.bootstrap"
class = "net.minecraft.Bootstrap"
member = "init"
descriptor = "()V"
kind = "static-method"
capability = "Observe vanilla bootstrap before Ravel's separately controlled registration barrier; vanilla has no registry freeze."

[[hook]]
id = "legacy.block-register"
class = "net.minecraft.block.Block"
member = "register"
descriptor = "(ILnet/minecraft/resource/Identifier;Lnet/minecraft/block/Block;)V"
kind = "static-method"
capability = "Observe numeric block ID, resource key and block identity; preserve ordering and serialized IDs without narrowing storage widths."

[[hook]]
id = "legacy.item-register"
class = "net.minecraft.item.Item"
member = "register"
descriptor = "(ILnet/minecraft/resource/Identifier;Lnet/minecraft/item/Item;)V"
kind = "static-method"
capability = "Observe numeric item ID and key after block registration; do not flatten metadata variants or infer a modern freeze."

[[hook]]
id = "legacy.block-state-from-metadata"
class = "net.minecraft.block.Block"
member = "deserialize"
descriptor = "(I)Lnet/minecraft/block/state/BlockState;"
kind = "static-method"
capability = "Observe packed legacy block-state ID decoding through the static dispatcher, including subclass metadata conversion; bits 0..11 select the numeric block ID and bits 12..15 carry metadata. Chunk palettes and block-update packets use the separate state registry and bypass this dispatcher."

[[hook]]
id = "legacy.block-metadata-from-state"
class = "net.minecraft.block.Block"
member = "serialize"
descriptor = "(Lnet/minecraft/block/state/BlockState;)I"
kind = "static-method"
capability = "Observe packed legacy block-state ID encoding through the static dispatcher, including subclass metadata conversion; preserve both numeric block ID and metadata. Chunk palettes and block-update packets use the separate state registry and bypass this dispatcher."

[[hook]]
id = "legacy.item-metadata"
class = "net.minecraft.item.ItemStack"
member = "getMetadata"
descriptor = "()I"
kind = "instance-method"
capability = "Observe item metadata independently of block metadata; do not truncate item variants to four bits."

[[hook]]
id = "legacy.client-tick"
side = "client-only"
class = "net.minecraft.client.Minecraft"
member = "tick"
descriptor = "()V"
kind = "instance-method"
capability = "Observe one client tick invocation, distinct from rendering and integrated-server simulation."

[[hook]]
id = "legacy.server-tick"
class = "net.minecraft.server.MinecraftServer"
member = "tick"
descriptor = "()V"
kind = "instance-method"
capability = "Observe the base server tick reached by dedicated and integrated execution; no has-time-left predicate exists. Integrated override delegation must be deduplicated by the runtime port."

[[hook]]
id = "legacy.integrated-server-tick"
side = "client-only"
class = "net.minecraft.server.integrated.IntegratedServer"
member = "tick"
descriptor = "()V"
kind = "instance-method"
capability = "Observe the integrated-server override separately from its base delegation; the runtime port must deduplicate a logical tick and retain paused-world semantics."

[[hook]]
id = "legacy.server-world-tick"
class = "net.minecraft.server.MinecraftServer"
member = "tickWorlds"
descriptor = "()V"
kind = "instance-method"
capability = "Observe world updates separately from the outer server tick, not as a second once-per-tick callback."

[[hook]]
id = "legacy.payload-client"
side = "client-only"
class = "net.minecraft.client.network.handler.ClientPlayNetworkHandler"
member = "handleCustomPayload"
descriptor = "(Lnet/minecraft/network/packet/s2c/play/CustomPayloadS2CPacket;)V"
kind = "instance-method"
capability = "Observe method entry before `PacketThreadUtil`: an off-client-thread invocation is observed before requeue/exit and observed again when dispatched on the client thread. WP4 must select the client-thread invocation and bound payload bytes; no modern codec or Forge discriminator contract is implied."

[[hook]]
id = "legacy.payload-server"
class = "net.minecraft.server.network.handler.ServerPlayNetworkHandler"
member = "handleCustomPayload"
descriptor = "(Lnet/minecraft/network/packet/c2s/play/CustomPayloadC2SPacket;)V"
kind = "instance-method"
capability = "Observe method entry before `PacketThreadUtil`: an off-server-thread invocation is observed before requeue/exit and observed again when dispatched on the server thread. WP4 must select the server-thread invocation and bound payload bytes; Forge wire compatibility is not implied."

[[hook]]
id = "legacy.resource-reload"
side = "client-only"
class = "net.minecraft.client.Minecraft"
member = "reloadResources"
descriptor = "()V"
kind = "instance-method"
capability = "Observe the legacy client resource reload entry; WP4 must establish one generation barrier spanning resource listeners, models and atlas. This is not a server datapack reload."

# Client renderer observations pin Feather's actual names, not MCP aliases.
[[hook]]
id = "legacy.renderer-frame"
side = "client-only"
class = "net.minecraft.client.Minecraft"
member = "runGame"
descriptor = "()V"
kind = "instance-method"
capability = "Observe the outer client frame; Feather names the runGameLoop body runGame."

[[hook]]
id = "legacy.renderer-terrain"
side = "client-only"
class = "net.minecraft.client.render.world.WorldRenderer"
member = "setupRender"
descriptor = "(Lnet/minecraft/entity/Entity;DLnet/minecraft/client/render/Culler;IZ)V"
kind = "instance-method"
capability = "Observe terrain visibility setup on the client render owner thread."

[[hook]]
id = "legacy.renderer-layer"
side = "client-only"
class = "net.minecraft.client.render.world.WorldRenderer"
member = "render"
descriptor = "(Lnet/minecraft/client/render/block/BlockLayer;DILnet/minecraft/entity/Entity;)I"
kind = "instance-method"
capability = "Observe a block-layer render without replacing its returned chunk count."

[[hook]]
id = "legacy.renderer-update"
side = "client-only"
class = "net.minecraft.client.render.world.WorldRenderer"
member = "compileChunksUntil"
descriptor = "(J)V"
kind = "instance-method"
capability = "Observe the client chunk update budget independently of worker compilation."

[[hook]]
id = "legacy.renderer-compile"
side = "client-only"
class = "net.minecraft.client.render.world.RenderChunk"
member = "compile"
descriptor = "(FFFLnet/minecraft/client/render/world/ChunkCompileTask;)V"
kind = "instance-method"
capability = "Observe rebuild compile-body normal returns, including early aborts; this does not prove successful compilation or cover transparency resort tasks."

[[hook]]
id = "legacy.renderer-task-create"
side = "client-only"
class = "net.minecraft.client.render.world.ChunkCompileTask"
member = "<init>"
descriptor = "(Lnet/minecraft/client/render/world/RenderChunk;Lnet/minecraft/client/render/world/ChunkCompileTask$Type;D)V"
kind = "instance-method"
capability = "Associate a newly constructed task with the current generation before it can enter a pending worker queue."

[[hook]]
id = "legacy.renderer-worker"
side = "client-only"
class = "net.minecraft.client.render.world.ChunkRenderWorker"
member = "runTask"
descriptor = "(Lnet/minecraft/client/render/world/ChunkCompileTask;)V"
kind = "instance-method"
capability = "Observe worker processing of a task whose renderer generation was captured at construction."

[[hook]]
id = "legacy.renderer-worker-complete"
side = "client-only"
class = "net.minecraft.client.render.world.ChunkRenderWorker$2"
member = "onSuccess"
descriptor = "(Ljava/util/List;)V"
kind = "instance-method"
capability = "Observe the nonbridge FutureCallback.onSuccess body returning normally, including cancelled-task early exits; this does not prove successful publication."

[[hook]]
id = "legacy.renderer-upload"
side = "client-only"
class = "net.minecraft.client.render.vertex.VertexBuffer"
member = "upload"
descriptor = "(Ljava/nio/ByteBuffer;)V"
kind = "instance-method"
capability = "Observe the client-owner OpenGL vertex-buffer upload without crossing a renderer object into the SDK."

[[hook]]
id = "legacy.renderer-unload"
side = "client-only"
class = "net.minecraft.client.Minecraft"
member = "setWorld"
descriptor = "(Lnet/minecraft/client/world/ClientWorld;Ljava/lang/String;)V"
kind = "instance-method"
capability = "Observe every central world replacement, including nonnull replacements, and invalidate outstanding renderer work."

[[hook]]
id = "legacy.renderer-close"
side = "client-only"
class = "net.minecraft.client.Minecraft"
member = "shutdown"
descriptor = "()V"
kind = "instance-method"
capability = "Observe client shutdown before renderer teardown and invalidate outstanding work."

[[hook]]
id = "legacy.atlas-reload"
side = "client-only"
class = "net.minecraft.client.render.texture.TextureAtlas"
member = "loadAndStitch"
descriptor = "(Lnet/minecraft/client/resource/manager/ResourceManager;)V"
kind = "instance-method"
capability = "Observe atlas loading and stitching within the legacy resource generation."

[[hook]]
id = "legacy.baked-model"
side = "client-only"
class = "net.minecraft.client.render.block.BlockModelRenderer"
member = "render"
descriptor = "(Lnet/minecraft/world/WorldView;Lnet/minecraft/client/resource/model/BakedModel;Lnet/minecraft/block/state/BlockState;Lnet/minecraft/util/math/BlockPos;Lnet/minecraft/client/render/vertex/BufferBuilder;ZJ)Z"
kind = "instance-method"
capability = "Capture the owning compile thread's actual model state and destination builder, without substituting cube geometry."

[[hook]]
id = "legacy.baked-quad"
side = "client-only"
class = "net.minecraft.client.resource.model.BakedQuad"
member = "getVertices"
descriptor = "()[I"
kind = "instance-method"
capability = "Capture exact vanilla baked model vertex words and independently resolved atlas sprite provenance."

[[hook]]
id = "legacy.baked-ao"
side = "client-only"
class = "net.minecraft.client.render.block.BlockModelRenderer$AmbientOcclusionFace"
member = "compute"
descriptor = "(Lnet/minecraft/world/WorldView;Lnet/minecraft/block/state/BlockState;Lnet/minecraft/util/math/BlockPos;Lnet/minecraft/util/math/Direction;[FLjava/util/BitSet;)V"
kind = "instance-method"
capability = "Capture vanilla AO corner brightness after its owning-thread computation."

[[hook]]
id = "legacy.baked-tint"
side = "client-only"
class = "net.minecraft.client.world.color.BlockColors"
member = "get"
descriptor = "(Lnet/minecraft/block/state/BlockState;Lnet/minecraft/world/WorldView;Lnet/minecraft/util/math/BlockPos;I)I"
kind = "instance-method"
capability = "Capture the exact vanilla block-color provider result independently of final buffer color words."

[[hook]]
id = "legacy.baked-vertices"
side = "client-only"
class = "net.minecraft.client.render.vertex.BufferBuilder"
member = "vertices"
descriptor = "([I)V"
kind = "instance-method"
capability = "Capture source model words before vanilla applies position, tint, AO and packed light."

[[hook]]
id = "legacy.baked-light"
side = "client-only"
class = "net.minecraft.client.render.vertex.BufferBuilder"
member = "lightColor"
descriptor = "(IIII)V"
kind = "instance-method"
capability = "Capture the four actual packed lightmap coordinates supplied to a model quad."

[[hook]]
id = "legacy.baked-color"
side = "client-only"
class = "net.minecraft.client.render.vertex.BufferBuilder"
member = "multiplyColor"
descriptor = "(FFFI)V"
kind = "instance-method"
capability = "Capture per-vertex vanilla RGB multipliers before integer color arithmetic."

[[hook]]
id = "legacy.baked-position"
side = "client-only"
class = "net.minecraft.client.render.vertex.BufferBuilder"
member = "postPosition"
descriptor = "(DDD)V"
kind = "instance-method"
capability = "Finish one source quad after its vanilla position operation; finalized buffers remain a separate oracle."

[[hook]]
id = "legacy.recipe-register"
class = "net.minecraft.crafting.CraftingManager"
member = "register"
descriptor = "(Lnet/minecraft/resource/Identifier;Lnet/minecraft/crafting/recipe/Recipe;)V"
kind = "static-method"
capability = "Observe legacy recipe key registration, distinct from modern datapack recipe application."

[[hook]]
id = "legacy.saved-data-dirty"
class = "net.minecraft.world.saveddata.SavedData"
member = "markDirty"
descriptor = "()V"
kind = "instance-method"
capability = "Observe aggregate dirty marking without replacing the live saved-data identity."

[[hook]]
id = "legacy.saved-data-load"
class = "net.minecraft.world.storage.SavedDataStorage"
member = "load"
descriptor = "(Ljava/lang/Class;Ljava/lang/String;)Lnet/minecraft/world/saveddata/SavedData;"
kind = "instance-method"
capability = "Observe `MapStorage` get-or-load by class and key; WP4 must distinguish global and per-dimension storage and client/server instances."

[[hook]]
id = "legacy.saved-data-set"
class = "net.minecraft.world.storage.SavedDataStorage"
member = "set"
descriptor = "(Ljava/lang/String;Lnet/minecraft/world/saveddata/SavedData;)V"
kind = "instance-method"
capability = "Observe staged aggregate installation in `MapStorage`; failed replacements must retain the prior live identity."

[[hook]]
id = "legacy.saved-data-save"
class = "net.minecraft.world.storage.SavedDataStorage"
member = "save"
descriptor = "()V"
kind = "instance-method"
capability = "Observe `MapStorage` save independently for each storage scope."

[[hook]]
id = "legacy.world-save"
class = "net.minecraft.server.MinecraftServer"
member = "saveWorlds"
descriptor = "(Z)V"
kind = "instance-method"
capability = "Observe server world saving shared by integrated and dedicated paths; the boolean is the legacy silent flag."

[[hook]]
id = "legacy.world-open"
class = "net.minecraft.server.MinecraftServer"
member = "loadWorld"
descriptor = "(Ljava/lang/String;Ljava/lang/String;JLnet/minecraft/world/gen/WorldGeneratorType;Ljava/lang/String;)V"
kind = "instance-method"
capability = "Admit the bounded staged aggregate before vanilla world creation, then bind global live storage on successful return."

[[hook]]
id = "legacy.world-open-integrated"
side = "client-only"
class = "net.minecraft.server.integrated.IntegratedServer"
member = "loadWorld"
descriptor = "(Ljava/lang/String;Ljava/lang/String;JLnet/minecraft/world/gen/WorldGeneratorType;Ljava/lang/String;)V"
kind = "instance-method"
capability = "Admit and bind integrated-server persistence on the owning server thread; this override does not invoke the base world-load method."

[[hook]]
id = "legacy.command-install"
class = "net.minecraft.server.command.handler.CommandManager"
member = "<init>"
descriptor = "(Lnet/minecraft/server/MinecraftServer;)V"
kind = "instance-method"
capability = "Observe successful vanilla command manager construction; Ravel installation waits for the owning server thread at world-open."

[[hook]]
id = "legacy.command-execute"
class = "net.minecraft.server.command.handler.CommandRegistry"
member = "run"
descriptor = "(Lnet/minecraft/server/command/source/CommandSource;Ljava/lang/String;)I"
kind = "instance-method"
capability = "Dispatch Ravel-owned legacy command roots with the actual source permission method and text response."

[[hook]]
id = "legacy.screen-open"
side = "client-only"
class = "net.minecraft.client.Minecraft"
member = "openScreen"
descriptor = "(Lnet/minecraft/client/gui/screen/Screen;)V"
kind = "instance-method"
capability = "Observe legacy GUI screen selection, including null when returning to the game; this does not extract render state."

[[hook]]
id = "legacy.screen-draw"
side = "client-only"
class = "net.minecraft.client.gui.screen.Screen"
member = "render"
descriptor = "(IIF)V"
kind = "instance-method"
capability = "Observe the base `GuiScreen` draw body only: subclass overrides that omit super are not observed. This is not complete draw-dispatch coverage, render-state extraction or permission to refuse a frame."

[[hook]]
id = "legacy.title-init"
side = "client-only"
class = "net.minecraft.client.gui.screen.TitleScreen"
member = "init"
descriptor = "()V"
kind = "instance-method"
capability = "Restore the Ravel title-menu entry after successful initialization, including resize-driven button rebuilds."

[[hook]]
id = "legacy.item-fire-damage"
class = "net.minecraft.entity.ItemEntity"
member = "takeDamage"
descriptor = "(Lnet/minecraft/entity/damage/DamageSource;F)Z"
kind = "instance-method"
capability = "Refuse only fire damage for Ravel-declared fire-resistant dropped items, preserving vanilla and other damage."

[[hook]]
id = "legacy.global-palette-size"
class = "net.minecraft.world.chunk.PalettedContainer"
member = "setBits"
descriptor = "(I)V"
kind = "instance-method"
capability = "Widen only the global state-registry size used for palette bit capacity, preserving sparse packed block-state IDs through the full legacy block-ID range."

[[nonGoal]]
id = "screen.extract-render-state"
reason = "Legacy GUI draws directly; no modern extraction phase exists. Screen observation remains separate from renderer replacement and cannot refuse a draw."

[[nonGoal]]
id = "registry.freeze"
reason = "Vanilla has no modern freeze. The essential Ravel-controlled barrier and stable numeric assignment policy belong to WP4, not a fake hook binding."

[[nonGoal]]
id = "resource.load-server-resources"
reason = "There are no server datapacks or modern reload event. Legacy recipe and client resource targets are separately inventoried."

[[nonGoal]]
id = "resource.register-reload-listener"
reason = "Legacy reload-listener registration is owned by the legacy runtime rather than a modern registration hook; resource-generation ordering is exercised by live reload acceptance."

[[nonGoal]]
id = "network.modern-codecs"
reason = "Channel payloads use legacy packet buffers; no modern payload codec target exists. Forge wire compatibility is not promised."

[[nonGoal]]
id = "save.modern-codec-factory"
reason = "`WorldSavedData` and `MapStorage` use NBT and class/key lookup, not modern saved-data codecs or factories."

[[nonGoal]]
id = "datafix.modern-dfu"
reason = "Legacy data-fixer migrations are required at WP4; modern Mojang `DataFixerUpper` is not a runtime dependency or equivalent API."

[[nonGoal]]
id = "renderer.modern-chunk-pipeline"
reason = "WP5 must replace legacy chunk/model/state rendering as a subsystem; binding a modern name cannot provide that capability."

[[nonGoal]]
id = "chat.sanitization"
reason = "Optional chat filtering and player-name validation interception is not reviewed for this legacy target; no modern `StringUtil` binding is substituted."

[[nonGoal]]
id = "input.mouse-smoothing"
reason = "Optional input smoothing observation is not reviewed for the legacy mouse implementation."

[[nonGoal]]
id = "server.timing-metrics"
reason = "Optional tick-counter, rolling timing, and average-tick-time observations are not reviewed; essential no-argument client/server tick targets are independently pinned."

[[nonGoal]]
id = "screen.modern-menu"
reason = "Optional title-menu row injection, widget factories, screen tick and sized init interception are not reviewed; legacy open and draw targets remain independently pinned."

[[nonGoal]]
id = "world.modern-open-flow"
reason = "Optional modern world-loader and pack-repository UI interception has no equivalent signature; legacy `MapStorage` and world-save targets supply the reviewed persistence seams."

[[nonGoal]]
id = "accessibility.narrator"
reason = "Vanilla narrator/text-to-speech uses JNA/text2speech natives, but the legacy platform grants native access only to LWJGL modules; this unsupported optional feature fails closed and is logged once."
