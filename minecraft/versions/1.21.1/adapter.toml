# Adapter inputs and exact upstream hashes for Minecraft 1.21.1.
#
# The rules the 26.1.2 file states hold unchanged: these are the only
# inputs the binding generator may read, every one of them pins a hash including
# the tracked ones, and editing hooks.toml, stubs.toml or reflection.toml means
# updating the hash below.
#
# What differs is the mapping source. 1.21.1 ships an obfuscated client jar —
# 8269 class entries, 26 of which keep a `net/minecraft/...` path because they
# carry `@DontObfuscate` — and Mojang publishes a client mapping for it from the
# same version manifest that publishes the jar. So the class files are not the
# mapping here, and `mappingSource` says so. `client.txt` is declared exactly as
# the jar is and is never tracked: it is upstream material this repository does
# not own, derived from the build that produced the jar, and at 9.6 MB larger
# than every tracked file of a version put together. What is tracked is its hash.

schemaVersion = 1
minecraft = "1.21.1"

# The Java release every jar built for this version is compiled for. A game
# refuses a class file newer than the runtime it declares, and `version.json`
# states which that is; this is re-derived from it on any machine that holds it.
javaRelease = 21

mappingSource = "official-proguard-mappings"

# The pack formats this version reads. A pack declaring a number the game does not
# recognise is a pack the game refuses, and the number moves with the version, so
# this is version data like the release above: declared for the machines that hold
# no jar and re-derived from the `version.json` inside the pinned client jar
# wherever one is present. That document states them as `resource` and `data`.
[packFormat]
resource = 34
resourceMinor = 0
data = 48
dataMinor = 0
spelling = "pack-format"

[inputs.clientJar]
path = "tests/fixtures/local/tooling/minecraft-1.21.1/client.jar"
sha256 = "499f6897d1837516680f3114072d8106e11c9adcd933fe5cf051b551089b0c99"
bytes = 26836906

# The published mapping the linked names are read from. Its sha1 is the one
# 1.21.1's own version manifest pins for `client_mappings`, which is the trail
# back from this hash to Mojang.
[inputs.clientMappings]
path = "tests/fixtures/local/tooling/minecraft-1.21.1/client.txt"
sha256 = "140c47931cccc8fc9e4c22d7603e2d714d1a953a146f51ea7397d95c955536ec"
bytes = 9598610
upstream = "https://piston-data.mojang.com/v1/objects/2244b6f072256667bcd9a73df124d6c58de77992/client.txt"

# 1.21.1 names DataFixerUpper 8.0.16, where 26.1.2 names 9.0.19. The hashes
# below were measured on the artefact `libraries.minecraft.net` serves, and its
# sha1 matches the `com.mojang:datafixerupper:8.0.16` artifact pin in 1.21.1's
# version manifest.
[inputs.dataFixerJar]
path = "tests/fixtures/local/tooling/minecraft-1.21.1/datafixerupper-8.0.16.jar"
sha256 = "ffc138bc2596c291781b0d5e211ccac51f0f2345f27fc2742f335cedf7e2870d"
bytes = 724313
upstream = "https://libraries.minecraft.net/com/mojang/datafixerupper/8.0.16/datafixerupper-8.0.16.jar"

[inputs.versionManifest]
path = "tests/fixtures/local/tooling/minecraft-1.21.1/version.json"
sha256 = "06ba60da1f8c6fe469bed1b348a064648bfdda57fc2fb56920e3f177f844fdfd"
upstream = "https://piston-meta.mojang.com/v1/packages/7d538f57bd7f3d0638755fa605a432494e736db3/1.21.1.json"

# What the JVM harness does not run for this version, and what would close it.
#
# The harness stands in for the game rather than loading it, and its stand-in
# classes are written under Mojang names wherever they are still hand-written. A
# section that names no generated class or member runs here unchanged, because
# the harness supplies the targets as well as the classes and neither is version
# data. The content and outward sections run here too, because their stand-in
# game is generated per version from `jvm/harness/template/` and carries the
# names this version links.
#
# Two of the three below match a name this repository generated against a stand-in
# that is still hand-written. `GameMembers` says `m:()Lftl;` here where the
# stand-in declares `getUiState`, so their drivers meet a stand-in that is not
# this version's game.
#
# The third is a different obstacle and a harder one. Persistence's stand-ins are
# generated per version now, and everything the section needs is rendered here
# except the class the save seam is declared on. This version keeps 26 classes in
# `net.minecraft` because they carry `@DontObfuscate` and moves the rest into the
# unnamed package, and `MinecraftServer` is one of the 26 while the two members
# the adapter reaches on it are typed by classes that moved. Java has no syntax
# for naming an unnamed-package class from inside a package, so that stand-in
# cannot be written as Java at all and this version renders none. The harness asks
# the generated tree whether it has one rather than being told.
#
# Each was measured on its own rather than inferred from the one before it. The
# run stops at its first failure, so measuring them by running the harness once
# would have measured only the earliest; instead each section was run here with
# the ones ahead of it removed, and the failure recorded below is the one that
# section produced. The recorded failures are: `net.minecraft.server.MinecraftServer`
# cannot find `aqu` or `erd` for persistence; the screen drivers do not compile,
# because the generated screens extend `fod` where the stand-in declares `Screen`;
# and the shipped agent jar rewrites none of the stand-in for settings, which the
# section reads as `transformed=0`.
#
# What that does not mean is that the adapters are wrong. The generator resolves
# every declared member through this version's mapping and requires the linked
# class file to declare it, so under the real jar these names are the game's own.
# What is missing is a stand-in that carries them.
#
# Declaring it here is what lets the gate tell a section nobody can run yet from
# a section that quietly stopped being run: an absence with no line here fails,
# and so does a line whose section has started running again.

[harness.notRun]
persistence = "this version splits its game between `net.minecraft` and the unnamed package, and Java cannot name a class outside every package from inside one, so the save seam's receiver has no stand-in a compiler will read; work package: emit the stand-in game as class files rather than as Java where a version's name spaces are split"
screens = "the screen sections need stand-ins that behave and this version's generated stubs carry its linked names with empty bodies, so their drivers do not compile; work package: generate the stand-in screens and their widget vocabulary per version from templates"
settings = "the settings round trip drives the shipped agent jar, whose transformer looks its targets up in this version's generated inventory, so the Mojang-named stand-in is not rewritten and the recorded counts describe another version; work package: generate the stand-in screens and their widget vocabulary per version from templates"

# The three hashes below pin the reviewed files beside this one.

[inputs.hookInventory]
path = "minecraft/versions/1.21.1/hooks.toml"
sha256 = "65928c8328f267b5021a29f42d71388882e576c908ae7c4f6d978db0581bf32c"
bytes = 19480

