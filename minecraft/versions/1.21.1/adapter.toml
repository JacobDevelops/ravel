# Adapter inputs and exact upstream hashes for Minecraft 1.21.1.
#
# The rules the 26.1.2 file states hold unchanged: these are the only
# inputs the binding generator may read, every one of them pins a hash including
# the tracked ones, and editing hooks.toml, stubs.toml or reflection.toml means
# updating the hash below.
#
# What differs is the mapping source. 1.21.1 ships an obfuscated client jar —
# 8269 class entries, 26 of which keep a `net/minecraft/...` path because they
# carry `@DontObfuscate` — and Mojang publishes a client mapping for it from the
# same version manifest that publishes the jar. So the class files are not the
# mapping here, and `mappingSource` says so. `client.txt` is declared exactly as
# the jar is and is never tracked: it is upstream material this repository does
# not own, derived from the build that produced the jar, and at 9.6 MB larger
# than every tracked file of a version put together. What is tracked is its hash.

schemaVersion = 1
minecraft = "1.21.1"

# The Java release every jar built for this version is compiled for. A game
# refuses a class file newer than the runtime it declares, and `version.json`
# states which that is; this is re-derived from it on any machine that holds it.
javaRelease = 21

mappingSource = "official-proguard-mappings"

# The pack formats this version reads. A pack declaring a number the game does not
# recognise is a pack the game refuses, and the number moves with the version, so
# this is version data like the release above: declared for the machines that hold
# no jar and re-derived from the `version.json` inside the pinned client jar
# wherever one is present. That document states them as `resource` and `data`.
[packFormat]
resource = 34
resourceMinor = 0
data = 48
dataMinor = 0
spelling = "pack-format"

[inputs.clientJar]
path = "tests/fixtures/local/tooling/minecraft-1.21.1/client.jar"
sha256 = "499f6897d1837516680f3114072d8106e11c9adcd933fe5cf051b551089b0c99"
bytes = 26836906

# The published mapping the linked names are read from. Its sha1 is the one
# 1.21.1's own version manifest pins for `client_mappings`, which is the trail
# back from this hash to Mojang.
[inputs.clientMappings]
path = "tests/fixtures/local/tooling/minecraft-1.21.1/client.txt"
sha256 = "140c47931cccc8fc9e4c22d7603e2d714d1a953a146f51ea7397d95c955536ec"
bytes = 9598610
upstream = "https://piston-data.mojang.com/v1/objects/2244b6f072256667bcd9a73df124d6c58de77992/client.txt"

# 1.21.1 names DataFixerUpper 8.0.16, where 26.1.2 names 9.0.19. The hashes
# below were measured on the artefact `libraries.minecraft.net` serves, and its
# sha1 matches the `com.mojang:datafixerupper:8.0.16` artifact pin in 1.21.1's
# version manifest.
[inputs.dataFixerJar]
path = "tests/fixtures/local/tooling/minecraft-1.21.1/datafixerupper-8.0.16.jar"
sha256 = "ffc138bc2596c291781b0d5e211ccac51f0f2345f27fc2742f335cedf7e2870d"
bytes = 724313
upstream = "https://libraries.minecraft.net/com/mojang/datafixerupper/8.0.16/datafixerupper-8.0.16.jar"

[inputs.versionManifest]
path = "tests/fixtures/local/tooling/minecraft-1.21.1/version.json"
sha256 = "06ba60da1f8c6fe469bed1b348a064648bfdda57fc2fb56920e3f177f844fdfd"
upstream = "https://piston-meta.mojang.com/v1/packages/7d538f57bd7f3d0638755fa605a432494e736db3/1.21.1.json"

# The three hashes below pin the reviewed files beside this one.

[inputs.hookInventory]
path = "minecraft/versions/1.21.1/hooks.toml"
sha256 = "65928c8328f267b5021a29f42d71388882e576c908ae7c4f6d978db0581bf32c"
bytes = 19480

[inputs.stubSeeds]
path = "minecraft/versions/1.21.1/stubs.toml"
sha256 = "745a0006d98685df4bfbcd35a9236994bcc1bd9769285f51af40dd0ae49a9e58"
bytes = 13250

[inputs.reflectiveSurface]
path = "minecraft/versions/1.21.1/reflection.toml"
sha256 = "7671cd5192eccf7a089fefd474676e90730e3adafc10f07521ddcf6b79049b06"
bytes = 12273

# The two locks below are generated, not fetched, and they are pinned for the
# machines that cannot check them any other way. Only RAVEL_REGENERATE_LOCKS
# rewrites them, and it rewrites the locks in the same breath.

[inputs.mappingsLock]
path = "minecraft/versions/1.21.1/mappings.lock"
sha256 = "9fe90dfbf140e2c69cbc0c52eee3bff551de615cef8a1975c5c95ee1c2e9fc77"
bytes = 7088

[inputs.stubsLock]
path = "minecraft/versions/1.21.1/stubs.lock"
sha256 = "a5c50ea3e3ed2f38727b0da239f0c0029fc9b360fc38f49a46d5a6561751899e"
bytes = 15009
