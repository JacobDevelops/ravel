# Game classes the always-present agent jar resolves by name, for Minecraft 1.21.1.
#
# Same set and same roles as 26.1.2: the `name` column is what survives a
# rename, which is exactly what this file demonstrates. 1.21.1 is obfuscated, so
# `runtime` is the linked name Mojang's published client mapping resolves `class`
# to, and `mapping.verify_reflection` re-derives every one of them on any build
# that can read the mapping. Two of the eighteen carry a different `class` than
# 26.1.2 does, because the game renamed the type and not the role.

schemaVersion = 1
minecraft = "1.21.1"
[[reflected]]
name = "MINECRAFT"
class = "net.minecraft.client.Minecraft"
runtime = "fgo"

[[reflected]]
name = "SIMPLE_SOUND_INSTANCE"
class = "net.minecraft.client.resources.sounds.SimpleSoundInstance"
runtime = "gtv"

[[reflected]]
name = "SOUND_INSTANCE"
class = "net.minecraft.client.resources.sounds.SoundInstance"
runtime = "gua"

[[reflected]]
name = "SOUND_MANAGER"
class = "net.minecraft.client.sounds.SoundManager"
runtime = "gvf"

[[reflected]]
name = "SOUND_EVENT"
class = "net.minecraft.sounds.SoundEvent"
runtime = "avo"

[[reflected]]
name = "REGISTRY"
class = "net.minecraft.core.Registry"
runtime = "jz"

[[reflected]]
name = "BUILT_IN"
class = "net.minecraft.core.registries.BuiltInRegistries"
runtime = "lt"

[[reflected]]
name = "REGISTRIES"
class = "net.minecraft.core.registries.Registries"
runtime = "lu"

[[reflected]]
# 1.21.1 calls this ResourceLocation; 26.1.2 calls it Identifier.
name = "IDENTIFIER"
class = "net.minecraft.resources.ResourceLocation"
runtime = "akr"

[[reflected]]
name = "RESOURCE_KEY"
class = "net.minecraft.resources.ResourceKey"
runtime = "akq"

[[reflected]]
name = "ITEM"
class = "net.minecraft.world.item.Item"
runtime = "cul"

[[reflected]]
name = "ITEM_PROPERTIES"
class = "net.minecraft.world.item.Item$Properties"
runtime = "cul$a"

[[reflected]]
name = "BLOCK"
class = "net.minecraft.world.level.block.Block"
runtime = "dfy"

[[reflected]]
name = "BLOCK_PROPERTIES"
class = "net.minecraft.world.level.block.state.BlockBehaviour$Properties"
runtime = "dtb$d"

[[reflected]]
name = "SERVER"
class = "net.minecraft.server.MinecraftServer"
runtime = "net.minecraft.server.MinecraftServer"

[[reflected]]
name = "DATA_FIXERS"
class = "net.minecraft.util.datafix.DataFixers"
runtime = "azx"

[[reflected]]
name = "LEVEL_RESOURCE"
class = "net.minecraft.world.level.storage.LevelResource"
runtime = "erd"

[[reflected]]
# 1.21.1 calls this DimensionDataStorage; 26.1.2 calls it SavedDataStorage.
name = "STORAGE"
class = "net.minecraft.world.level.storage.DimensionDataStorage"
runtime = "eqz"
