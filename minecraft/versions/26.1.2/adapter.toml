# Adapter inputs and exact upstream hashes for Minecraft 26.1.2.
#
# These are the only inputs the binding generator is allowed to read. The jar
# itself is a restricted local fixture that is never tracked; what is tracked is
# its hash, so any change to the input is detected before generation runs.
#
# Every input pins a hash, including the tracked ones. An input with nothing to
# verify against is refused rather than read: the hook inventory decides which
# methods the agent rewrites, so it is the last file that should be the one
# nothing checks. Editing hooks.toml therefore means updating the hash below, and
# that is the point.

schemaVersion = 1
minecraft = "26.1.2"

# 26.1.2 ships unobfuscated class files and publishes no client mapping file, so
# the class files are the mapping. See docs/decisions/adg-3-bindings.md.
mappingSource = "unobfuscated-class-files"

[inputs.clientJar]
path = "tests/fixtures/local/tooling/minecraft-26.1.2/client.jar"
sha256 = "b1b3158572666445eff01e82fad8c7de2e4953db6d354f311730d77a8359d0b0"
bytes = 38113927

[inputs.versionManifest]
path = "tests/fixtures/local/tooling/minecraft-26.1.2/version.json"
sha256 = "c0befcb001356cf53de2ee7cfa8fa796afcd3e2fe4530274c66d473cc576c98b"
upstream = "https://piston-meta.mojang.com/v1/packages/a5ba42111e0de7712d677c458bd0dbfc9f36482e/26.1.2.json"

[inputs.hookInventory]
path = "minecraft/versions/26.1.2/hooks.toml"
sha256 = "a217161105b84a5b9a6e4d19f7e4f0d7c5ce55ac80c28d02d38f874aeb766216"
bytes = 11756

[inputs.stubSeeds]
path = "minecraft/versions/26.1.2/stubs.toml"
sha256 = "f275936e10d02deea0238487c61fa99747c6df7a0a8cd5a22587ed950220d487"
bytes = 4024
