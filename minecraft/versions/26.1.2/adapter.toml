# Adapter inputs and exact upstream hashes for Minecraft 26.1.2.
#
# These are the only inputs the binding generator is allowed to read. The jar
# itself is a restricted local fixture that is never tracked; what is tracked is
# its hash, so any change to the input is detected before generation runs.
#
# Every input pins a hash, including the tracked ones. An input with nothing to
# verify against is refused rather than read: the hook inventory decides which
# methods the agent rewrites, so it is the last file that should be the one
# nothing checks. Editing hooks.toml therefore means updating the hash below, and
# that is the point.

schemaVersion = 1
minecraft = "26.1.2"

# 26.1.2 ships unobfuscated class files and publishes no client mapping file, so
# the class files are the mapping. See docs/decisions/adg-3-bindings.md.
mappingSource = "unobfuscated-class-files"

[inputs.clientJar]
path = "tests/fixtures/local/tooling/minecraft-26.1.2/client.jar"
sha256 = "b1b3158572666445eff01e82fad8c7de2e4953db6d354f311730d77a8359d0b0"
bytes = 38113927

[inputs.dataFixerJar]
path = "tests/fixtures/local/tooling/minecraft-26.1.2/datafixerupper-9.0.19.jar"
sha256 = "9653a39cf5c4853cc98628d902dcb23ffeb2755122ecc563bde38c8f60c0b61e"
bytes = 731440

[inputs.versionManifest]
path = "tests/fixtures/local/tooling/minecraft-26.1.2/version.json"
sha256 = "c0befcb001356cf53de2ee7cfa8fa796afcd3e2fe4530274c66d473cc576c98b"
upstream = "https://piston-meta.mojang.com/v1/packages/a5ba42111e0de7712d677c458bd0dbfc9f36482e/26.1.2.json"

[inputs.hookInventory]
path = "minecraft/versions/26.1.2/hooks.toml"
sha256 = "334b0103c6b32cedffa806d5dee430e0e07a21e6933ee19fd6a4c94e0d43eeb1"
bytes = 13995

[inputs.stubSeeds]
path = "minecraft/versions/26.1.2/stubs.toml"
sha256 = "8b606de49c0737e1768348cc094f674f9efe60c8afff860e37020e5d340f743c"
bytes = 8136

# The reflective surface is a generator input because the names in it are
# compiled into the agent jar: `GameNames` is rendered from this file, so an
# unpinned edit would change what the shipped jar resolves without changing a
# hash. Editing reflection.toml therefore means updating the hash below, exactly
# as editing the inventory does.

[inputs.reflectiveSurface]
path = "minecraft/versions/26.1.2/reflection.toml"
sha256 = "2237eb4f39a81624891e1de8dc227668c6acec23e8f99d4206500e3c1a1d99b4"
bytes = 12878

# The two locks below are generated, not fetched, and they are pinned for the
# machines that cannot check them any other way. Without the jars there is
# nothing to resolve against, so generating from a lock and comparing the result
# back to that same lock only proves the file is well formed. These hashes are
# what the jars produced, so a stale lock fails on a jar-less machine too. Only
# RAVEL_REGENERATE_LOCKS rewrites them, and it rewrites the locks in the same
# breath.

[inputs.mappingsLock]
path = "minecraft/versions/26.1.2/mappings.lock"
sha256 = "51ab7af6554e1d5f80327dc71a52cc015addbbd089c1b343085bb9793c899ed9"
bytes = 7027

[inputs.stubsLock]
path = "minecraft/versions/26.1.2/stubs.lock"
sha256 = "ec58e92ac9fba5c0ae051741ba8b0813f3cb2073184dbcbe1db3e2e6bf7e1c57"
bytes = 9243
