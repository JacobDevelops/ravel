# Game classes the always-present agent jar resolves by name, for Minecraft 26.1.2.
#
# ADG-1 forbids that jar from *declaring* a game type and `build-agent.sh` enforces
# it by construction, compiling with no `-cp` at all. ADG-4 admits a hook that
# observes or vetoes, so anything the host has to *perform* — storing a world's
# aggregate, registering a mod's block, starting a sound — is performed by a
# hand-written adapter under `jvm/bootstrap` that reaches the game by name instead.
# This file is that set, declared rather than inferred.
#
# Each entry carries three things. `name` is the role the adapter reaches the class
# for, and it is the same word under every version because it names what the class
# is *to Ravel*. `class` is the Mojang name a reviewer reads. `runtime` is the name
# the JVM actually links, which is the Mojang name under an unobfuscated source and
# an obfuscated one otherwise. The generator emits `runtime` into
# `dev.ravel.jvm.GameNames` as the constant `name`, and the adapters under
# `jvm/bootstrap` resolve `GameNames.<name>` rather than a literal of their own:
# one shared source tree cannot spell one version's names and still be right about
# another, and a literal reintroduced there fails the scaffold contract.
#
# It is version data and not a constant in `ravel-xtask` because these names are
# 26.1.2's. `net.minecraft.resources.Identifier` is called `ResourceLocation` at
# 1.21.1 and `net.minecraft.world.level.storage.SavedDataStorage` is called
# `DimensionDataStorage` there, so a single global list would assert one version's
# names against another and pass while doing it. The `name` column is what survives
# both renames, which is why the adapters spell that and not the class.
#
# Content registration is not here. It is compiled against `stubs.toml`'s seeds in
# the sibling artifact rather than reflected from the agent jar, because the two
# versions disagree about the work and not only about the names: 26.1.2's
# properties builders demand a registry key stamped on them and 1.21.1 declares no
# setter for one.
#
# Each entry also carries the members of that class the adapters reach by name.
# A member is declared the way the adapter asks for it and never both ways at
# once: `descriptor` where the lookup names its parameter types, written in the
# reviewed name space like every other descriptor this generator reads, and
# `parameters` where the lookup gives a name and an argument count, which is what
# a lookup by width does. No class is listed here only to be named as a parameter
# type: a descriptor-declared member carries its parameter types itself, and the
# mapping translates them whether or not this file mentions them.
#
# Every class an adapter resolves is here, including the ones `hooks.toml` also
# pins as hook targets: the generated constants are this file's whole set, so a
# class covered elsewhere but absent here would have no constant to reach it by.
# Those names are re-pinned against the jar by `mappings.lock` as well; these are
# not, which is the deviation `evidence/m3/manifest.json` records and `ROADMAP.md`
# carries as owed work. What `runtime` does close is the half of that gap the
# mapping decides: it is re-derived from the mapping source on every build that can
# read one, so a `runtime` that no longer follows from `class` fails generation.
# The members close the other half wherever the jar is present: every one of them
# is resolved through the mapping and then required to be declared by the class
# file the JVM will link, so a member this version renamed or dropped fails
# generation instead of failing a launch.
#
# The generator also emits each descriptor-declared member into
# `dev.ravel.jvm.GameMembers`, as the linked name and the linked descriptor
# together, and the persistence adapter resolves `GameMembers.<class>_<member>`
# rather than spelling a member of its own. That pair is what identifies one
# member: a name and an argument count does not once obfuscation collapses names,
# and the adapter would then call whichever method the class file declared first.
#
# Every member below is asked for through `GameMembers`, so what this file
# declares is what the adapters ask for, in both directions.
#
# This file is a generator input and `adapter.toml` pins its hash, because the
# names in it are compiled into the agent jar.

schemaVersion = 1
minecraft = "26.1.2"

[[reflected]]
# The two distribution entry points, which are what names the running side. The
# transformer sees every class before it initialises, and the first of these to
# load says which distribution this process was started from — a question a
# premain class-path probe cannot answer, because the published server jar is a
# bundler whose real jars are not on any loader yet. Neither carries a member:
# only the name is compared.
name = "CLIENT_ENTRY_POINT"
class = "net.minecraft.client.main.Main"
runtime = "net.minecraft.client.main.Main"

[[reflected]]
name = "SERVER_ENTRY_POINT"
class = "net.minecraft.server.Main"
runtime = "net.minecraft.server.Main"

# The client, reached for its sound manager and for the running-client check the
# persistence adapter makes before it touches a world.
[[reflected]]
name = "MINECRAFT"
class = "net.minecraft.client.Minecraft"
runtime = "net.minecraft.client.Minecraft"

[[reflected.member]]
name = "getInstance"
descriptor = "()Lnet/minecraft/client/Minecraft;"

[[reflected.member]]
name = "getSoundManager"
descriptor = "()Lnet/minecraft/client/sounds/SoundManager;"

[[reflected.member]]
name = "setScreen"
descriptor = "(Lnet/minecraft/client/gui/screens/Screen;)V"

# The outward sound path: an instance is built from an event and handed to the
# manager, and the two instance types are separate because one is the interface
# the manager takes and the other is the implementation that is constructed.
[[reflected]]
name = "SIMPLE_SOUND_INSTANCE"
class = "net.minecraft.client.resources.sounds.SimpleSoundInstance"
runtime = "net.minecraft.client.resources.sounds.SimpleSoundInstance"

[[reflected.member]]
name = "forUI"
descriptor = "(Lnet/minecraft/sounds/SoundEvent;F)Lnet/minecraft/client/resources/sounds/SimpleSoundInstance;"

[[reflected]]
name = "SOUND_MANAGER"
class = "net.minecraft.client.sounds.SoundManager"
runtime = "net.minecraft.client.sounds.SoundManager"

[[reflected.member]]
name = "play"
descriptor = "(Lnet/minecraft/client/resources/sounds/SoundInstance;)Lnet/minecraft/client/sounds/SoundEngine$PlayResult;"

[[reflected]]
# What the manager's play request takes, which is the erased type it declares.
# Named here for its linked name alone: the agent jar passes it inside the
# descriptor it looks the request up by, and the harness's stand-in has to
# declare that same type or declare a different method.
name = "SOUND_INSTANCE"
class = "net.minecraft.client.resources.sounds.SoundInstance"
runtime = "net.minecraft.client.resources.sounds.SoundInstance"

[[reflected]]
# What this version answers a play request with, named here for the same reason
# and only here: the other tracked version answers nothing at all.
name = "SOUND_PLAY_RESULT"
class = "net.minecraft.client.sounds.SoundEngine$PlayResult"
runtime = "net.minecraft.client.sounds.SoundEngine$PlayResult"

[[reflected]]
name = "SOUND_EVENT"
class = "net.minecraft.sounds.SoundEvent"
runtime = "net.minecraft.sounds.SoundEvent"

[[reflected.member]]
name = "createVariableRangeEvent"
descriptor = "(Lnet/minecraft/resources/Identifier;)Lnet/minecraft/sounds/SoundEvent;"

# Content registration: a registry, the built-in set every registered thing lands
# in, the keys that name one, and the namespaced identifier it carries.
[[reflected]]
name = "IDENTIFIER"
class = "net.minecraft.resources.Identifier"
runtime = "net.minecraft.resources.Identifier"

[[reflected.member]]
name = "fromNamespaceAndPath"
descriptor = "(Ljava/lang/String;Ljava/lang/String;)Lnet/minecraft/resources/Identifier;"

# The two content types a mod registers, each with the nested properties builder
# its constructor takes.
# Persistence: the server that owns the world's directory and the level that
# holds its storage, the storage itself, the resource constant that names a
# world's root, and the fixer set the storage's three-argument constructor takes.
[[reflected]]
name = "SERVER"
class = "net.minecraft.server.MinecraftServer"
runtime = "net.minecraft.server.MinecraftServer"

[[reflected.member]]
name = "getWorldPath"
descriptor = "(Lnet/minecraft/world/level/storage/LevelResource;)Ljava/nio/file/Path;"

[[reflected.member]]
name = "overworld"
descriptor = "()Lnet/minecraft/server/level/ServerLevel;"

[[reflected]]
# The level the storage hangs off. This version also declares a storage getter on
# the server itself and 1.21.1 does not, so the adapter goes through the level
# under both rather than taking a shortcut one of them does not offer.
name = "SERVER_LEVEL"
class = "net.minecraft.server.level.ServerLevel"
runtime = "net.minecraft.server.level.ServerLevel"

[[reflected.member]]
name = "getDataStorage"
descriptor = "()Lnet/minecraft/world/level/storage/SavedDataStorage;"

[[reflected]]
# The world being opened, held over its own lock while the load is decided.
name = "LEVEL_STORAGE_ACCESS"
class = "net.minecraft.world.level.storage.LevelStorageSource$LevelStorageAccess"
runtime = "net.minecraft.world.level.storage.LevelStorageSource$LevelStorageAccess"

[[reflected.member]]
name = "getLevelPath"
descriptor = "(Lnet/minecraft/world/level/storage/LevelResource;)Ljava/nio/file/Path;"

[[reflected]]
# The loaded world, reached for the registries the storage decodes against.
name = "WORLD_STEM"
class = "net.minecraft.server.WorldStem"
runtime = "net.minecraft.server.WorldStem"

[[reflected.member]]
name = "registries"
descriptor = "()Lnet/minecraft/core/LayeredRegistryAccess;"

[[reflected]]
# What a storage decodes its stored objects against. Named here for its linked
# name alone, like the sound instance above: the agent jar passes it inside the
# descriptor it looks the storage constructor up by, and the harness's stand-in
# has to declare that same type or declare a different constructor.
name = "HOLDER_LOOKUP_PROVIDER"
class = "net.minecraft.core.HolderLookup$Provider"
runtime = "net.minecraft.core.HolderLookup$Provider"

[[reflected]]
# What the layered registries composite down to, named here for the reason above
# and one more: it is what the adapter hands the constructor, so a stand-in that
# left it unrelated to the provider would throw at a launch rather than here.
name = "REGISTRY_ACCESS_FROZEN"
class = "net.minecraft.core.RegistryAccess$Frozen"
runtime = "net.minecraft.core.RegistryAccess$Frozen"

[[reflected]]
name = "REGISTRY_LAYERS"
class = "net.minecraft.core.LayeredRegistryAccess"
runtime = "net.minecraft.core.LayeredRegistryAccess"

[[reflected.member]]
name = "compositeAccess"
descriptor = "()Lnet/minecraft/core/RegistryAccess$Frozen;"

[[reflected]]
name = "DATA_FIXERS"
class = "net.minecraft.util.datafix.DataFixers"
runtime = "net.minecraft.util.datafix.DataFixers"

[[reflected.member]]
name = "getDataFixer"
descriptor = "()Lcom/mojang/datafixers/DataFixer;"

[[reflected]]
# Only the world root is named here. The saved-data directory below it is reached
# by resolving the game's own name for it against the root, because 1.21.1 has no
# constant for that directory and both versions spell it the same way.
name = "LEVEL_RESOURCE"
class = "net.minecraft.world.level.storage.LevelResource"
runtime = "net.minecraft.world.level.storage.LevelResource"

[[reflected.member]]
name = "ROOT"
descriptor = "Lnet/minecraft/world/level/storage/LevelResource;"

[[reflected]]
name = "STORAGE"
class = "net.minecraft.world.level.storage.SavedDataStorage"
runtime = "net.minecraft.world.level.storage.SavedDataStorage"

[[reflected.member]]
name = "<init>"
descriptor = "(Ljava/nio/file/Path;Lcom/mojang/datafixers/DataFixer;Lnet/minecraft/core/HolderLookup$Provider;)V"

[[reflected.member]]
name = "get"
descriptor = "(Lnet/minecraft/world/level/saveddata/SavedDataType;)Lnet/minecraft/world/level/saveddata/SavedData;"

[[reflected.member]]
name = "set"
descriptor = "(Lnet/minecraft/world/level/saveddata/SavedDataType;Lnet/minecraft/world/level/saveddata/SavedData;)V"

[[reflected]]
# Back in the surface for one thing only. Registering a block puts it in the
# registry and nothing else; vanilla's own bootstrap then walks every registered
# block and adds each of its states to the id mapper the network protocol writes
# block updates through. A block registered after that loop has run is in the
# registry and in no mapper, and the first block update naming it disconnects the
# session. Ravel does the same walk for the blocks it registers.
name = "BLOCK"
class = "net.minecraft.world.level.block.Block"
runtime = "net.minecraft.world.level.block.Block"

[[reflected.member]]
name = "getStateDefinition"
descriptor = "()Lnet/minecraft/world/level/block/state/StateDefinition;"

[[reflected.member]]
name = "BLOCK_STATE_REGISTRY"
descriptor = "Lnet/minecraft/core/IdMapper;"

[[reflected]]
name = "STATE_DEFINITION"
class = "net.minecraft.world.level.block.state.StateDefinition"
runtime = "net.minecraft.world.level.block.state.StateDefinition"

[[reflected.member]]
# The list is a Guava type, which is why this walk is reflective rather than
# compiled beside the registration: neither tracked jar carries Guava, so a stub
# declaring this return type could not compile. Reflection names no type.
name = "getPossibleStates"
descriptor = "()Lcom/google/common/collect/ImmutableList;"

[[reflected]]
name = "ID_MAPPER"
class = "net.minecraft.core.IdMapper"
runtime = "net.minecraft.core.IdMapper"

[[reflected.member]]
name = "add"
descriptor = "(Ljava/lang/Object;)V"

[[reflected]]
# Where a state's cache is initialised. Declared as the class that carries the
# member rather than as `BlockState`, which inherits it and declares nothing.
name = "BLOCK_STATE_BASE"
class = "net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase"
runtime = "net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase"

[[reflected.member]]
name = "initCache"
descriptor = "()V"

[[reflected]]
# The create-world screen, whose staging members Ravel performs rather than
# observes. Three of the four below are private, which is why they are declared
# here: ADG-4 keeps a hook's hands off a receiver's members, so a hook observes
# the screen and an adapter reaches the members by the names this file pins.
name = "CREATE_WORLD_SCREEN"
class = "net.minecraft.client.gui.screens.worldselection.CreateWorldScreen"
runtime = "net.minecraft.client.gui.screens.worldselection.CreateWorldScreen"

[[reflected.member]]
# The screen's own state, which is where the configuration two of the three
# calls below need comes from. Reading it rather than passing the game's default is what
# keeps a world being recreated from silently re-enabling a pack its player had
# turned off.
name = "getUiState"
descriptor = "()Lnet/minecraft/client/gui/screens/worldselection/WorldCreationUiState;"

[[reflected.member]]
# Forces the screen's staging directory and the repository over it into
# existence, and hands back both. It is the only way to reach that directory
# without naming a member the versions spell differently.
name = "getDataPackSelectionSettings"
descriptor = "(Lnet/minecraft/world/level/WorldDataConfiguration;)Lcom/mojang/datafixers/util/Pair;"

[[reflected.member]]
# Reloads the screen's data from a repository. The boolean asks whether an
# experimental selection should be confirmed by the player first, and Ravel
# passes false: the pack it just staged is its own and needs no dialog.
name = "tryApplyNewDataPacks"
descriptor = "(Lnet/minecraft/server/packs/repository/PackRepository;ZLjava/util/function/Consumer;)V"

[[reflected.member]]
# The data load itself. The call above runs it only when the selection it reads
# differs from the one the screen holds, and Ravel reaches it directly for the
# case that comparison cannot see: the pack's files replaced under a selection
# that already names it, where the screen would otherwise hand the created world
# the data it loaded before the replacement.
name = "applyNewPackConfig"
descriptor = "(Lnet/minecraft/server/packs/repository/PackRepository;Lnet/minecraft/world/level/WorldDataConfiguration;Ljava/util/function/Consumer;)V"

[[reflected]]
# The repository the create-world screen stages packs in. Ravel reaches it
# because the call above reads a selection rather than making one: a pack written
# after the screen built this repository is neither discovered nor selected, and
# both of those are steps somebody has to take.
name = "PACK_REPOSITORY"
class = "net.minecraft.server.packs.repository.PackRepository"
runtime = "net.minecraft.server.packs.repository.PackRepository"

[[reflected.member]]
# Rescans the directory, which is what makes a pack written a moment ago exist
# as far as this repository is concerned.
name = "reload"
descriptor = "()V"

[[reflected.member]]
# What is selected now, which is what the pack has to be added to rather than
# replace: a player who turned a pack off keeps it off.
name = "getSelectedIds"
descriptor = "()Ljava/util/Collection;"

[[reflected.member]]
# Replaces the selection with the ids given, dropping any the rescan did not
# find. Declared by descriptor like every member here, and this member is a
# plain demonstration of why: an obfuscated version links it and
# `getAvailableIds` under one name, and only the descriptor tells the writer
# from the reader.
name = "setSelected"
descriptor = "(Ljava/util/Collection;)V"

[[reflected]]
# The pack configuration the screen's members carry, named here for its linked
# name alone: the agent jar passes it inside two of the descriptors above, and
# the harness's stand-in has to declare that same type or declare different
# members.
name = "WORLD_DATA_CONFIGURATION"
class = "net.minecraft.world.level.WorldDataConfiguration"
runtime = "net.minecraft.world.level.WorldDataConfiguration"

[[reflected]]
name = "WORLD_CREATION_UI_STATE"
class = "net.minecraft.client.gui.screens.worldselection.WorldCreationUiState"
runtime = "net.minecraft.client.gui.screens.worldselection.WorldCreationUiState"

[[reflected.member]]
name = "getSettings"
descriptor = "()Lnet/minecraft/client/gui/screens/worldselection/WorldCreationContext;"

[[reflected]]
name = "WORLD_CREATION_CONTEXT"
class = "net.minecraft.client.gui.screens.worldselection.WorldCreationContext"
runtime = "net.minecraft.client.gui.screens.worldselection.WorldCreationContext"

[[reflected.member]]
