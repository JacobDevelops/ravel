# generic signature, and the JVM links on the erased one.
#
# What this file does not promise:
#
# - It is checked only where the client jar is. A machine without the jar
#   generates from this file, so on that machine the lock is the source and
#   cannot disagree with anything. Drift is caught where the jar exists.
# - It pins against a jar hash, so it is only as current as that pin. A
#   Minecraft build nobody has re-pinned against is unchecked.
# - It carries no hierarchy the stub set does not already hold. A supertype
#   outside the set is dropped, so a change to one is invisible here.
# - It covers the members `stubs.toml` seeds and nothing else. A member the
#   screen starts calling is unpinned until it is seeded.
#
# This is a different table from mappings.lock and stays one. That file
# pins call sites the agent rewrites; this one pins declarations the screen
# compiles against, and one table meaning both is how the next person
# misreads it.

