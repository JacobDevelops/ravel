# Game classes the Ravel settings screen compiles against, for Minecraft 26.1.2.
#
# `jvm/build/build-screen.sh` cannot put the client jar on its class path: the
# jar is a restricted local fixture that most machines do not hold, which is the
# property `build-agent.sh` already protects for the agent. So the screen is
# compiled against generated stub declarations of the few game types it names.
#
# This file names classes and member names. It never names a descriptor, and
# that is the whole reason the stubs are generated: a hand-written stub
# transcribes the generic signature a person read, and the JVM links on the
# erased one. Every descriptor, access flag, and supertype edge in
# `stubs.lock` comes out of the pinned jar.
#
# A member name that the class overloads stubs every overload. Picking one would
# mean writing down the descriptor that tells them apart, which is the
# transcription this avoids.
#
# Adding an entry means regenerating `stubs.lock` and re-pinning the hash in
# `adapter.toml`, exactly as adding a hook does.

schemaVersion = 1
minecraft = "26.1.2"

[[stub]]
# The screen's superclass. `<init>` is the constructor it calls through, `init`
# is the method it overrides to build its widgets, `addRenderableWidget` is how
# each one is added, and `onClose` is what the done button calls. `font`, `width`
# and `height` are the fields a widget is positioned and measured against.
role = "Screen"
class = "net.minecraft.client.gui.screens.Screen"
members = [
  "<init>",
  "init",
  "addRenderableWidget",
  "onClose",
  "font",
  "width",
  "height",
]

[[stub]]
# The title-menu bridge asks the running client to replace its current screen.
role = "Minecraft"
class = "net.minecraft.client.Minecraft"
members = ["getInstance", "setScreen"]

[[stub]]
# The screen's title and every widget label cross as one of these.
role = "Component"
class = "net.minecraft.network.chat.Component"
members = ["translatable", "literal"]

[[stub]]
# What `addRenderableWidget` takes. It is seeded with no member because nothing
# calls one: it is here so the widget classes below declare it as a supertype and
# are assignable to that parameter, which is the erased type the jar declares.
role = "GuiEventListener"
class = "net.minecraft.client.gui.components.events.GuiEventListener"
members = []

[[stub]]
# The base every widget below extends, and the class that carries the
# `GuiEventListener` edge. `setMessage` is what a widget that changes its own
# label calls.
role = "AbstractWidget"
class = "net.minecraft.client.gui.components.AbstractWidget"
members = ["setMessage"]

[[stub]]
# Toggles and choices are both buttons that cycle a value and relabel themselves,
# so one button covers both and no checkbox or cycle button is seeded. 26.1.2
# makes `Button` abstract and reaches it through `builder`, which is why the two
# nested types below are here.
role = "Button"
class = "net.minecraft.client.gui.components.Button"
members = ["builder"]

[[stub]]
role = "Button$Builder"
class = "net.minecraft.client.gui.components.Button$Builder"
members = ["bounds", "build"]

[[stub]]
# Seeded for its method rather than only for its name: the screen implements this
# interface for every button it builds.
role = "Button$OnPress"
class = "net.minecraft.client.gui.components.Button$OnPress"
members = ["onPress"]

[[stub]]
# A bounded number is the only thing a slider can honestly draw, and this is the
# only widget the screen subclasses. `value` is the position it reads, and
# `updateMessage` and `applyValue` are what the jar declares abstract.
#
# `AbstractButton` is deliberately not here, and adding it would be a mistake
# that compiles. It declares `extractContents(GuiGraphicsExtractor, int, int,
# float)` abstract, so subclassing it means implementing render-state
# extraction — and ADG-6 omits `extractRenderState` on purpose: Ravel never
# draws. This class is subclassed instead precisely because the two methods it
# declares abstract are neither of them an extraction.
role = "AbstractSliderButton"
class = "net.minecraft.client.gui.components.AbstractSliderButton"
members = ["<init>", "value", "updateMessage", "applyValue"]

[[stub]]
# Everything a slider or a choice cannot constrain is typed into one of these.
role = "EditBox"
class = "net.minecraft.client.gui.components.EditBox"
members = ["<init>", "getValue", "setValue", "setEditable", "setMaxLength"]

[[stub]]
# The screen already reaches this class through `Screen.font`; this seeds the one
# method it calls on it. A row wider than the widget drawing it renders only its
# tail, because `EditBox.setValue` parks the cursor at the end and the box scrolls
# its display window to the cursor. Splitting is therefore not decoration, it is
# what makes a long row readable at all, and it is the font's job: the game
# measures glyphs, and a screen that counted characters instead would break on
# every script whose glyphs are not one width.
role = "Font"
class = "net.minecraft.client.gui.Font"
members = ["splitIgnoringLanguage"]

[[stub]]
# What splitting takes and answers. `of` wraps one string, `getString` reads one
# split line back out. Seeded rather than reusing `Component` because the split
# answers this type, and a screen that had to name `Component` on the way back
# would be asserting an edge between the two that only the jar can state.
role = "FormattedText"
class = "net.minecraft.network.chat.FormattedText"
members = ["of", "getString"]

[[stub]]
# What a saved-data owner is registered as. Seeded for its constructor rather
# than for a method anything calls: `SavedDataType(Identifier, Supplier<T>,
# Codec<T>, DataFixTypes)` is the signature that names `Codec`, and a descriptor
# read out of the jar is the only place that name can honestly come from.
role = "SavedDataType"
class = "net.minecraft.world.level.saveddata.SavedDataType"
members = ["<init>"]

[[stub]]
# Not a game class: it is declared by the DataFixerUpper library the game's own
# signatures name, which is why `adapter.toml` pins that jar as a second class
# source. `SavedDataType` takes one in its constructor, so a saved-data type
# cannot be written down without being able to write this down first.
#
# `xmap` turns the byte codec below into one over Ravel's own saved-data class,
# and `fieldOf` puts it under a key so the encoded form is the compound tag the
# saved-data storage writes. A bare leaf codec would encode to a string tag and
# the storage would have nothing to write.
role = "Codec"
class = "com.mojang.serialization.Codec"
members = ["xmap", "fieldOf"]

[[stub]]
# What `fieldOf` answers. `codec` is what turns it back into a `Codec`, which is
# the type `SavedDataType`'s constructor names.
role = "MapCodec"
class = "com.mojang.serialization.MapCodec"
members = ["codec"]

[[stub]]
# The leaf codec Ravel's aggregate crosses as. It is already `Codec<byte[]>`, so
# nothing here hand-rolls a byte codec, and it is seeded from this class rather
# than from `Codec` itself because the codec constants on `Codec` are fields on
# an interface — implicitly final, and a stub cannot invent the value one would
# need.
role = "ExtraCodecs"
class = "net.minecraft.util.ExtraCodecs"
members = ["BASE64_STRING"]

[[stub]]
# The superclass of Ravel's one stored object. It is abstract, which is the whole
# reason this half cannot live in the agent jar: storing a Ravel-owned saved data
# means defining a concrete subclass of a game type, and reflection defines none.
role = "SavedData"
class = "net.minecraft.world.level.saveddata.SavedData"
members = ["<init>", "setDirty"]

[[stub]]
# What a saved-data type is named by. The constructor is private, so the factory
# is what a name can be built through.
role = "Identifier"
class = "net.minecraft.resources.Identifier"
members = ["fromNamespaceAndPath"]

[[stub]]
# The fixer family `SavedDataType`'s constructor takes. Seeded for the one
# constant Ravel names, whose byte preservation across the pinned version range
# is what ADG-7's evidence measured.
role = "DataFixTypes"
class = "net.minecraft.util.datafix.DataFixTypes"
members = ["SAVED_DATA_COMMAND_STORAGE"]

[[stub]]
# Content registration, from here down. The identifier a claim is registered
# under; 1.21.1 calls this class ResourceLocation and binds the same role to it.
role = "Registry"
class = "net.minecraft.core.Registry"
members = ["register"]

[[stub]]
# What the built-in holders below are declared as. Seeded for its name rather
# than for a member: the register call takes the supertype, and a field cannot be
# declared as a class the stub tree does not carry.
role = "DefaultedRegistry"
class = "net.minecraft.core.DefaultedRegistry"
members = []

[[stub]]
role = "BuiltInRegistries"
class = "net.minecraft.core.registries.BuiltInRegistries"
members = ["BLOCK", "ITEM"]

[[stub]]
# The root keys a registry is named by. Only this version needs them: they exist
# to build the key its properties builders demand, and 1.21.1 demands none.
role = "Registries"
class = "net.minecraft.core.registries.Registries"
members = ["BLOCK", "ITEM"]

[[stub]]
role = "ResourceKey"
class = "net.minecraft.resources.ResourceKey"
members = ["create"]

[[stub]]
role = "Block"
class = "net.minecraft.world.level.block.Block"
members = ["<init>"]

[[stub]]
# `setId` is this version's alone. Its constructors read the id back out, so a
# properties object without one fails at construction rather than at
# registration.
role = "BlockBehaviour$Properties"
class = "net.minecraft.world.level.block.state.BlockBehaviour$Properties"
members = [
  "of",
  "setId",
  "strength",
  "requiresCorrectToolForDrops",
  "randomTicks",
]

[[stub]]
role = "Item"
class = "net.minecraft.world.item.Item"
members = ["<init>"]

[[stub]]
role = "Item$Properties"
class = "net.minecraft.world.item.Item$Properties"
members = ["<init>", "setId", "stacksTo", "fireResistant"]

[[stub]]
# The item that places a block. An item sharing a block's identifier is that
# block's placing item and not a second thing that happens to be named the same,
# so it is constructed from the block; a plain item has no use-on and right
# clicking it does nothing, which is what the eighth launch saw.
role = "BlockItem"
class = "net.minecraft.world.item.BlockItem"
members = ["<init>"]
