# Rust is managed by rustup through rust-toolchain.toml.
[tools]
"aqua:sagiegurari/cargo-make" = "0.37.24"
"github:nextest-rs/nextest" = { version = "cargo-nextest-0.9.148", matching = "cargo-nextest" }
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-deny" = "0.20.2"
"aqua:tamasfe/taplo" = "0.10.0"
"pipx:check-jsonschema" = "0.38.2"
uv = "0.13.1"
jq = "1.8.2"
java = "temurin-27.0.0+35"
node = "26.12.0"
"npm:markdownlint-cli" = "0.49.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
jj = "0.46.0"
actionlint = "1.7.12"

[env]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"
RAVEL_MINECRAFT_VERSION = "{{ get_env(name='RAVEL_MINECRAFT_VERSION', default='26.1.2') }}"
