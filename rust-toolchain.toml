[toolchain]
channel = "nightly"
profile = "minimal"
components = ["clippy", "llvm-tools", "rust-analyzer", "rustfmt"]
targets = [
  "aarch64-apple-darwin",
  # The WebAssembly mod-execution spike builds a guest for this target.
  # Production crates never target it.
  "wasm32-unknown-unknown",
  "x86_64-unknown-linux-gnu",
]
