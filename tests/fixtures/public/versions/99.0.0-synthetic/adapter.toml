# Adapter inputs for the synthetic second version.
#
# The jar hashes below pin files that do not exist and never will: this version
# is invented, so there is no artefact to fetch and nothing restricted to track.
# That is what makes the fixture exercise the jar-less path, which is the path
# every machine without the pinned game already takes.

schemaVersion = 1
minecraft = "99.0.0-synthetic"

# Invented, like the rest of this directory. The pinned version records why a
# real one would say unobfuscated class files; a synthetic one records the same
# string because the generator compares it to the lock and to nothing else.
mappingSource = "unobfuscated-class-files"

