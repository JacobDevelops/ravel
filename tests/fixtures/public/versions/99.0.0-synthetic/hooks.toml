# Reviewed hook capability inventory for the synthetic second version.
#
# Nothing here is a real game. Every class, member and descriptor below is
# invented, and the version this directory is named for does not exist, because
# tracking a real game artefact is forbidden and proving version isolation does
# not need one. What is real is the *shape*: this is a drop-in replacement for
# the pinned version's data, laid out exactly as `minecraft/versions/<version>/`
# is, so a generator that reads it reads nothing it would not read for a real
# second version.
#
# The hook ids are deliberately the pinned version's own. An id is the only name
# ADG-3 says survives a game update, so a second version of the same capability
# surface names the same ids and maps them onto its own classes and members.
# That is the isolation being proved: what changes between versions is this data,
# and what does not change is the id a general crate names.

schemaVersion = 1
minecraft = "99.0.0-synthetic"

