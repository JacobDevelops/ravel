# Reflective surface for the synthetic second version.
#
# Nothing here is a real game, exactly as `hooks.toml` beside it is not. What is
# real is the shape: the same eighteen roles the pinned version declares, mapped
# onto this version's own invented classes. That is the isolation being proved.
# The shared adapters under `jvm/bootstrap` spell the role and never the class,
# so a second version renaming every class renames nothing in a Java source.

schemaVersion = 1
minecraft = "99.0.0-synthetic"

[[reflected]]
name = "MINECRAFT"
class = "org.exampleengine.client.Client"
runtime = "org.exampleengine.client.Client"

